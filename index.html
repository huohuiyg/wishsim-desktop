<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>祈愿 · Wish Simulator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#070c18; --navy2:#0d1730; --navy3:#152139; --navy4:#1d2b49;
  --gold:#d3bc8e; --gold-l:#f4e8c6; --gold-d:#7d6839;
  --r3:#5f86c9; --r3g:#93b9f7;
  --r4:#9a6dd7; --r4g:#cba4ff;
  --r5:#d9952f; --r5g:#ffd76a;
  --txt:#e9e5dc; --txt-dim:#9aa4bb;
}
body{
  background:var(--navy);color:var(--txt);min-height:100vh;overflow-x:hidden;
  font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle at 1px 1px, rgba(190,215,255,.13) 1px, transparent 0);
  background-size:52px 52px;
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1100px 620px at 50% -18%, rgba(94,148,235,.20), transparent 70%),
    radial-gradient(900px 520px at 12% 105%, rgba(211,188,142,.09), transparent 70%);
}
/* 右下角留出「祈愿」按钮的落位（404+38+28 ≈ 470px），页脚文字因此改为贴底左对齐；
   窄屏放不下时改由 @media (max-width:960px) 把页脚整体上抬到按钮带之上 */
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 20px 24px;
  display:flex;flex-direction:column;min-height:100vh}
.serif{font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",serif}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;
  padding:12px 22px;margin:0 -20px 20px;
  background:linear-gradient(180deg,rgba(7,12,24,.97),rgba(7,12,24,.75) 72%,transparent);
  backdrop-filter:blur(8px);
}
.logo{display:flex;align-items:center;gap:9px;margin-right:auto}
.logo .mark{width:26px;height:26px;flex:0 0 auto}
.logo b{font-family:"Songti SC","Noto Serif SC",serif;font-size:19px;letter-spacing:5px;color:var(--gold-l);font-weight:600}
.logo small{color:var(--txt-dim);font-size:10px;letter-spacing:2.5px;padding-left:9px;border-left:1px solid rgba(211,188,142,.28)}
/* ---------- top-right nav ---------- */
.tbtn{
  display:flex;align-items:center;gap:7px;padding:7px 16px;cursor:pointer;font-family:inherit;
  border-radius:999px;font-size:13px;letter-spacing:1.5px;color:var(--gold-l);white-space:nowrap;
  background:linear-gradient(180deg,rgba(29,43,73,.92),rgba(13,23,48,.92));
  border:1px solid rgba(211,188,142,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  transition:border-color .18s, background .18s, transform .18s
}
.tbtn:hover{border-color:var(--gold);background:linear-gradient(180deg,rgba(211,188,142,.24),rgba(211,188,142,.08));transform:translateY(-1px)}
.tbtn:active{transform:translateY(0)}
.tbtn svg{flex:0 0 auto;display:block}

/* ---------- action bar ---------- */
.actions{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap;align-items:stretch}
.wbtn{
  position:relative;flex:1 1 220px;min-height:58px;cursor:pointer;border:none;font-family:inherit;
  border-radius:4px;color:#241c08;font-size:16px;letter-spacing:2px;font-weight:600;
  background:linear-gradient(180deg,#f7edd0,#d8bf8b 55%,#b99c64);
  box-shadow:0 8px 24px -10px rgba(211,188,142,.9), inset 0 1px 0 #fff8e0;
  transition:transform .16s, filter .16s;display:flex;align-items:center;justify-content:center;gap:12px
}
.wbtn small{font-size:11px;letter-spacing:0;opacity:.75;font-weight:500;display:block;margin-top:1px}
.wbtn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.wbtn:active{transform:translateY(0) scale(.985)}
.wbtn[disabled]{filter:grayscale(.8) brightness(.7);cursor:not-allowed;transform:none}
.wbtn.sec{
  flex:0 0 auto;min-height:58px;padding:0 25px;color:var(--gold-l);font-size:13px;letter-spacing:2px;font-weight:400;
  background:linear-gradient(180deg,rgba(29,43,73,.95),rgba(13,23,48,.95));
  border:1px solid rgba(211,188,142,.35);box-shadow:none
}
.wbtn.sec:hover{border-color:var(--gold)}

/* ---------- 悬浮「祈愿·1」——青绿横幅（按参考图复刻） ---------- */
/* 定位：视口右下角固定（right/bottom 各 38px 留白）。
   尺寸 = 基准 --w0/--h0/--f0 × 用户倍率 --sc（「对象管理 → 按钮」里调），断点只覆盖基准值。 */
#p1.wbg{
  --w0:404;--h0:96;--f0:52;--sc:1;
  --w:calc(var(--w0) * var(--sc) * 1px);
  --h:calc(var(--h0) * var(--sc) * var(--hr,1) * 1px);
  --fs:calc(var(--f0) * var(--sc) * 1px);
  --gapR:80px;--gapB:38px;
  position:fixed;z-index:40;right:var(--gapR);bottom:var(--gapB);
  width:var(--w);height:var(--h);max-width:calc(100vw - var(--gapR) - 16px);overflow:visible;
  padding:0;border:0;background:none;cursor:pointer;font-family:inherit;
  transition:filter .18s,transform .18s;-webkit-tap-highlight-color:transparent
}
/* ---------- 边框上的 Q 版小角色 ----------
   两层结构：.back 用 z-index:-1 垫在横幅之后（身体被挡住），.front 用 z-index:3 盖在横幅之上（手抓边框）。
   两层的 viewBox / 尺寸 / 位置必须完全一致，靠同一组 CSS 保证像素级对齐。 */
#p1.wbg .chibi{position:absolute;display:block;pointer-events:none;overflow:hidden;filter:drop-shadow(0 2px 4px rgba(46,96,36,.28))}
#p1.wbg .chibi.back{z-index:-1}
#p1.wbg .chibi.front,#p1.wbg .cBL{z-index:3}
/* 右上：双手趴在横幅上边框，头与手露在框外 */
#p1.wbg .cTR{
  width:calc(var(--h) * 0.9773);height:calc(var(--h) * 0.86);
  right:calc(var(--w) * 0.075);top:calc(var(--h) * -0.706)
}
/* 左下：站在横幅左下角前 */
#p1.wbg .cBL{
  width:calc(var(--h) * 0.72);height:calc(var(--h) * 0.96);
  left:calc(var(--w) * 0.030);bottom:calc(var(--h) * -0.19)
}
#p1.wbg .gbsvg{
  position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;
  animation:gbBreath 4.2s ease-in-out infinite
}
/* 文字两层（自下而上）：浅绿描边 → 白色渐变字面；外发光用容器 drop-shadow
   不用负 z-index：它会盖住 background-clip 的字面，只剩描边 */
#p1.wbg .gbl{
  position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  font-size:var(--fs);line-height:1;font-weight:900;letter-spacing:.02em;white-space:nowrap;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  filter:drop-shadow(0 2px 2px rgba(40,96,26,.32)) drop-shadow(0 0 4px rgba(255,255,255,.55))
}
#p1.wbg .gbl>*,#p1.wbg .gbl::after{grid-area:1/1}
#p1.wbg .gbl::after{content:attr(data-t)}
#p1.wbg .gbt{-webkit-text-stroke:5px #5aa74d;color:transparent}   /* ① 底：绿色描边 */
#p1.wbg .gbl::after{                                                /* ② 面：白色字面 */
  background:linear-gradient(180deg,#ffffff 0%,#ffffff 64%,#f7ffe8 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent
}
#p1.wbg:hover{filter:brightness(1.03) saturate(1.04);transform:translateY(-2px)}
#p1.wbg:active{transform:translateY(0) scale(.985)}
#p1.wbg.cold{filter:grayscale(.6) brightness(.84)}
#p1.wbg.cold .gbsvg{animation:none}
#p1.wbg.cold:hover{filter:grayscale(.25) brightness(.96)}
@keyframes gbBreath{
  0%,100%{filter:drop-shadow(0 8px 18px rgba(58,116,48,.26)) drop-shadow(0 0 11px rgba(206,244,150,.55))}
  50%{filter:drop-shadow(0 8px 18px rgba(58,116,48,.26)) drop-shadow(0 0 26px rgba(206,244,150,.95))}
}
@media (max-width:1200px){ #p1.wbg{--w0:346;--h0:82;--f0:44} }
@media (max-width:660px){
  #p1.wbg{--w0:292;--h0:69;--f0:37;--gapR:36px;--gapB:24px}
}

/* ---------- 自定义按钮皮肤（相册 / 相机图片替代横幅外观） ----------
   启用皮肤时隐藏横幅本体 .gbsvg，让用户的图片直接充当按钮。
   文字(.gbl) 与小角色(.chibi) 默认「不再叠加」（图片优先）：用户传进来的
   常常就是一张自带文字的整张按钮图，叠上我们的文字会重影；
   需要时可在面板里重新勾上「叠加按钮文字 / 叠加小角色」。 */
#p1.wbg .skinimg{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  object-fit:cover;object-position:center;pointer-events:none;
  border-radius:var(--skr,0px);opacity:0;transition:opacity .28s ease
}
#p1.wbg .skinimg.fitcontain{object-fit:contain}
#p1.wbg .skinscrim{
  position:absolute;inset:0;pointer-events:none;border-radius:var(--skr,0px);
  background:#05080f;opacity:0;transition:opacity .28s ease
}
#p1.wbg.skinned .skinimg{opacity:1}
#p1.wbg.skinned .skinscrim{opacity:var(--sko,0)}
#p1.wbg.skinned .gbsvg{display:none}
#p1.wbg.skinned.notext .gbl{display:none}
#p1.wbg.skinned.nochibi .chibi{display:none}
/* 换成任意照片后，为薄荷底设计的「白字 + 绿描边」会读不出来：
   统一换成半透明深色描边 + 更强投影，保证在明暗照片上都立得住。 */
#p1.wbg.skinned .gbt{-webkit-text-stroke:5px rgba(18,40,14,.66)}
#p1.wbg.skinned .gbl{
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.72)) drop-shadow(0 0 3px rgba(0,0,0,.55))
}

/* ---------- 空卡池提示 ---------- */
.empty-hint{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;
  text-align:center;color:var(--txt-dim);font-size:13px;letter-spacing:1.5px
}
.empty-hint .eh{font-family:"Songti SC","Noto Serif SC",serif;font-size:18px;letter-spacing:7px;color:rgba(244,232,198,.75)}
.empty-hint .mini{pointer-events:auto}

.foot{margin-top:auto;padding-top:26px;font-size:11px;color:#66718a;line-height:1.9;text-align:left;letter-spacing:.4px;text-shadow:0 1px 8px rgba(0,0,0,.85);
  align-self:flex-start;max-width:calc(100% - var(--wishReserve, 470px))}
/* 窄屏 / 按钮调大后放不下 → 由 syncWishLayout() 给 body 加 .wishlift，把页脚整体抬到按钮带之上 */
body.wishlift .wrap{padding-bottom:var(--wishLift, 152px)}
body.wishlift .foot{align-self:stretch;max-width:100%;text-align:center}

/* ---------- wish animation ---------- */
#fxLayer{position:fixed;inset:0;z-index:9000;display:none}
#fxLayer.on{display:block}
#fxCanvas{position:absolute;inset:0;width:100%;height:100%}
#fxLayer .vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 50%, transparent 28%, rgba(0,0,0,.72) 100%)}
#fxLayer .skipbtn{
  position:absolute;right:26px;bottom:26px;z-index:5;cursor:pointer;font-size:12px;letter-spacing:3px;
  color:rgba(233,229,220,.55);padding:9px 18px;border:1px solid rgba(233,229,220,.25);border-radius:999px;
  background:rgba(0,0,0,.35);transition:.2s;user-select:none
}
#fxLayer .skipbtn:hover{color:var(--gold-l);border-color:var(--gold)}
#fxLayer .hitmsg{
  position:absolute;left:0;right:0;top:15%;text-align:center;z-index:4;pointer-events:none;
  font-family:"Songti SC","Noto Serif SC",serif;font-size:17px;letter-spacing:12px;text-indent:12px;
  opacity:0;transition:opacity .55s, transform .55s;transform:translateY(10px);
  color:#fff;text-shadow:0 0 30px currentColor
}
#fxLayer .hitmsg.show{opacity:1;transform:none}

/* ---------- reveal（可爱风：奶油马卡龙 · 圆润贴纸） ---------- */
#rvLayer{
  /* 稀有度在浅底上要「浅卡面 + 深描边」才有对比；只在本层覆盖，不动全局 --r3/4/5 */
  --r3:#a9d7f6; --r3g:#4a9bd8;
  --r4:#d7bdfa; --r4g:#8f5fd0;
  --r5:#ffd98a; --r5g:#e08a1e;
  position:fixed;inset:0;z-index:10000;display:none;flex-direction:column;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 50% 42%, rgba(255,255,255,.94) 0%, rgba(255,255,255,.62) 42%, rgba(255,255,255,.32) 100%),
    linear-gradient(168deg,#fdf4ff 0%,#e6f5ff 46%,#e3fbec 100%);
  backdrop-filter:blur(12px) saturate(1.06);-webkit-backdrop-filter:blur(12px) saturate(1.06);padding:22px
}
#rvLayer.on{display:flex}
#rvStage{position:relative;display:grid;place-items:center;flex:0 0 auto}

/* 背后飘浮的小星星 / 糖豆光点 */
.rvdeco{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.rvdeco i{
  position:absolute;display:block;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #fff 0%, var(--dc) 34%, var(--dc) 68%, rgba(255,255,255,0) 100%);
  /* 静态 opacity 兜底：display:none → .on 时动画会从 delay 重新计时，
     这段空窗期若用 0 就是「刚打开时背景一片空白」 */
  opacity:.42;animation:floaty var(--dur,9s) ease-in-out infinite
}
.rvdeco i.st{
  border-radius:0;background:var(--dc);
  clip-path:polygon(50% 0%,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0% 50%,39% 39%)
}
@keyframes floaty{
  0%{opacity:0;transform:translateY(16px) scale(.82) rotate(0deg)}
  18%{opacity:1}
  68%{opacity:.86}
  100%{opacity:0;transform:translateY(-48px) scale(1.1) rotate(34deg)}
}

/* 柔和光芒：保留放射结构，降低透明度 + 轻微模糊，去掉硬边 */
.rays{
  position:absolute;width:680px;height:680px;left:50%;top:44%;translate:-50% -50%;z-index:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,
    rgba(0,0,0,0) 0deg 7deg, var(--rg) 7deg 10.5deg, rgba(0,0,0,0) 10.5deg 27deg);
  mask-image:radial-gradient(circle, #000 5%, rgba(0,0,0,.4) 32%, transparent 64%);
  -webkit-mask-image:radial-gradient(circle, #000 5%, rgba(0,0,0,.4) 32%, transparent 64%);
  filter:blur(1.4px);
  animation:spin 22s linear infinite;opacity:0;transition:opacity .7s
}
.rays.on{opacity:.44}
@keyframes spin{to{transform:rotate(360deg)}}

.card{
  position:relative;width:256px;height:398px;border-radius:26px;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;
  background:#fff;border:3px solid #fff;
  box-shadow:0 20px 44px -18px rgba(96,128,104,.55), 0 0 0 2px var(--rc), 0 0 62px -14px var(--rg);
  animation:cardIn .5s cubic-bezier(.2,.9,.3,1.4) both;
  --rc:var(--r3);--rg:var(--r3g)
}
@keyframes cardIn{0%{opacity:0;transform:scale(.68) translateY(24px) rotate(-5deg)}100%{opacity:1;transform:none}}
.card.r3{--rc:var(--r3);--rg:var(--r3g)}
.card.r4{--rc:var(--r4);--rg:var(--r4g)}
.card.r5{--rc:var(--r5);--rg:var(--r5g)}
.card .bg{position:absolute;inset:0;z-index:0;
  background:linear-gradient(168deg,#ffffff 0%,var(--rc) 34%,var(--rg) 72%,var(--rg) 100%)}
.card .bg::after{content:'';position:absolute;inset:0;background:
  radial-gradient(circle at 50% 22%, rgba(255,255,255,.95), transparent 56%),
  radial-gradient(circle at 14% 86%, rgba(255,255,255,.55), transparent 44%)}
.card .artw{position:absolute;inset:0;bottom:96px;z-index:2;display:grid;place-items:center}
.card .artw>*{grid-area:1/1}   /* 描边层与字面层重叠，靠 z-index 分先后 */
.card .mono-out{               /* 底：只画描边环，填充透明 */
  writing-mode:vertical-rl;text-orientation:upright;
  font-family:"YouYuan","幼圆","Yuanti SC","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  font-weight:700;letter-spacing:9px;line-height:1;max-height:calc(100% - 12px);
  color:transparent;-webkit-text-stroke:16px var(--rg);
  filter:drop-shadow(0 6px 12px rgba(96,110,96,.3));
  /* 与字面层同步淡入，否则橙色描边会在剪影还没淡出时先冒出来 */
  animation:monoIn .52s .30s ease both
}
.card .mono{                   /* 面：白色字面，盖住描边环的内侧 */
  writing-mode:vertical-rl;text-orientation:upright;
  font-family:"YouYuan","幼圆","Yuanti SC","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  font-weight:700;letter-spacing:9px;line-height:1;max-height:calc(100% - 12px);
  color:#fff
}
.card .info{
  position:relative;z-index:3;padding:13px 14px 15px;text-align:center;
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.82) 30%, rgba(255,255,255,.95));
  border-top:2px dashed rgba(148,172,152,.42)
}
.card .nm{font-family:"YouYuan","幼圆","Yuanti SC","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-weight:700;font-size:19px;letter-spacing:2px;color:#4c5c4e;text-shadow:0 1px 0 #fff}
.card .st{font-size:17px;letter-spacing:3px;margin-top:4px;line-height:1;color:var(--rg);
  text-shadow:0 1px 0 #fff, 0 0 12px rgba(255,255,255,.9)}
.card .mt{font-size:11.5px;letter-spacing:2px;margin-top:7px;color:#8a9a8e}
.card .badge{
  position:absolute;top:11px;left:11px;z-index:5;font-size:10px;letter-spacing:2px;padding:4px 11px;border-radius:999px;
  background:linear-gradient(180deg,#ffe89a,#ffb347);color:#7a4a06;font-weight:700;
  box-shadow:0 3px 9px -3px rgba(190,130,30,.6), inset 0 0 0 2px rgba(255,255,255,.9)
}
.card .badge.dup{background:linear-gradient(180deg,#eaf1f7,#c6d3de);color:#4c5c68;box-shadow:inset 0 0 0 2px rgba(255,255,255,.9)}
.card::before{content:'';position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:23px;
  border:2px solid rgba(255,255,255,.8);opacity:1;
  box-shadow:inset 0 0 32px -6px rgba(255,255,255,.95)}
.card.r5{box-shadow:0 22px 52px -18px rgba(176,120,40,.5), 0 0 0 2px var(--rc), 0 0 78px -10px var(--rg)}

#rvGrid{display:none;grid-template-columns:repeat(5,86px);gap:10px;margin-top:6px}
#rvGrid.on{display:grid}
.gc{
  position:relative;height:124px;border-radius:16px;overflow:hidden;border:2px solid #fff;
  display:flex;flex-direction:column;justify-content:flex-end;padding:6px 5px;gap:2px;
  box-shadow:0 10px 20px -12px rgba(96,128,104,.6);
  animation:gin .34s cubic-bezier(.2,.9,.3,1.4) both
}
@keyframes gin{0%{opacity:0;transform:translateY(12px) scale(.9)}100%{opacity:1;transform:none}}
.gc{--rc:var(--r3);--rg:var(--r3g)}
.gc .gbg{position:absolute;inset:0;background:linear-gradient(168deg,#fff 0%,var(--rc) 62%,var(--rg) 100%)}
.gc .gmono{
  position:absolute;top:15px;left:0;right:0;text-align:center;z-index:1;
  font-family:"YouYuan","幼圆","Yuanti SC","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-weight:700;font-size:38px;line-height:1;color:#fff;
  font-family:"YouYuan","幼圆","Yuanti SC","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  font-weight:700;font-size:38px;line-height:1;color:#fff;
  /* 小字号不能用居中描边：38px 的笔画只有 3~4px，6px 描边会把字形糊成一块色块，
     改用多层 text-shadow 做外描边，字面保持完整 */
  text-shadow:
    0 0 1px var(--rg),
    1.7px 0 var(--rg), -1.7px 0 var(--rg), 0 1.7px var(--rg), 0 -1.7px var(--rg),
    1.2px 1.2px var(--rg), -1.2px 1.2px var(--rg), 1.2px -1.2px var(--rg), -1.2px -1.2px var(--rg),
    0 3px 6px rgba(96,110,96,.35)
}
.gc .gn{position:relative;z-index:2;font-size:10.5px;font-weight:600;text-align:center;color:#4c5c4e;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 0 rgba(255,255,255,.9)}
.gc .gs{position:relative;z-index:2;font-size:9px;font-weight:700;text-align:center;color:var(--rg);letter-spacing:1px}
.gc .gk{position:absolute;top:4px;right:4px;z-index:3;font-size:8.5px;font-weight:700;color:#7a4a06;
  background:rgba(255,233,155,.95);padding:1px 5px;border-radius:999px}
#rvFooter{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap;justify-content:center;min-height:52px}
#rvFooter.hide{visibility:hidden}
#rvTitle{
  font-family:"YouYuan","幼圆","Yuanti SC","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;font-weight:700;font-size:15px;letter-spacing:10px;text-indent:10px;
  color:#fff;-webkit-text-stroke:6px #7cc26a;paint-order:stroke fill;
  filter:drop-shadow(0 3px 8px rgba(96,160,86,.4));margin-bottom:20px
}
/* 可爱风胶囊按钮：只作用于揭示层，主界面按钮样式不动 */
#rvFooter .wbtn.sec{
  min-height:48px;padding:0 28px;border-radius:999px;font-size:14px;font-weight:700;letter-spacing:2px;
  color:#2f6b3a;border:2px solid #fff;
  background:linear-gradient(180deg,#f9fded,#b7e08a);
  box-shadow:0 10px 22px -10px rgba(92,160,80,.75), inset 0 1px 0 #fff
}
#rvFooter .wbtn.sec:hover{border-color:#fff;filter:brightness(1.05)}
#rvLayer .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:99}

/* ---------- 自定义壁纸层 ---------- */
#wallLayer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:#070c18}
#wallLayer>*{position:absolute;inset:0;width:100%;height:100%}
#wallLayer .wi,#wallLayer .wv{object-fit:cover;object-position:center;display:block}
#wallLayer .wv{opacity:0}
#wallLayer.video .wi{opacity:0}
#wallLayer.video .wv{opacity:1}
#wallLayer.contain .wi,#wallLayer.contain .wv{object-fit:contain}
#wallLayer .wveil{background:rgba(4,8,18,0);transition:background .25s}
#wallLayer .wvig{background:radial-gradient(120% 90% at 50% 40%, transparent 30%, rgba(0,0,0,.55) 100%);opacity:0;transition:opacity .25s}
#wallLayer.vig .wvig{opacity:1}
@keyframes kbzoom{0%{transform:scale(1.05) translate3d(0,0,0)}100%{transform:scale(1.18) translate3d(-1.6%,-1.2%,0)}}
#wallLayer.kb .wi,#wallLayer.kb .wv{animation:kbzoom 30s ease-in-out infinite alternate}
body.has-wall{background:#05080f}
body.has-wall::before,body.has-wall::after{opacity:0}

/* ---------- 壁纸 / 相机面板 ---------- */
.wallgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.wallcard{border:1px solid rgba(211,188,142,.24);border-radius:6px;padding:15px 12px;cursor:pointer;text-align:center;
  background:linear-gradient(180deg,rgba(21,32,57,.85),rgba(11,18,38,.85));transition:.2s}
.wallcard:hover{border-color:var(--gold);background:linear-gradient(180deg,rgba(34,48,80,.9),rgba(15,24,48,.9));transform:translateY(-2px)}
.wallcard .gi{font-size:24px;line-height:1;margin-bottom:8px;filter:drop-shadow(0 0 10px rgba(211,188,142,.5))}
.wallcard b{display:block;font-size:13px;color:var(--gold-l);letter-spacing:1px;font-weight:600}
.wallcard span{display:block;font-size:11px;color:var(--txt-dim);margin-top:5px;line-height:1.65}
.wprev{margin-top:14px;border:1px solid rgba(211,188,142,.22);border-radius:6px;overflow:hidden;background:#060a14;
  position:relative;aspect-ratio:16/9}
.wprev>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.wprev .ph{display:grid;place-items:center;color:#556085;font-size:12px;letter-spacing:2px}
.camwrap{position:relative;border-radius:6px;overflow:hidden;background:#000;aspect-ratio:16/9;border:1px solid rgba(211,188,142,.3)}
.camwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(var(--mir,1))}
.camwrap .cmsg{position:absolute;inset:0;display:grid;place-items:center;color:#8b96b4;font-size:12.5px;letter-spacing:1.5px;
  text-align:center;line-height:1.9;padding:20px;background:#05080f}
.camrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px;align-items:center}
.slider{display:grid;grid-template-columns:112px 1fr 62px;gap:11px;align-items:center;margin-top:10px}
.slider>span{font-size:12px;color:var(--txt-dim);letter-spacing:.5px}
.slider>em{font-size:12px;color:var(--gold-l);font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;background:rgba(211,188,142,.25);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:linear-gradient(180deg,var(--gold-l),var(--gold));cursor:pointer;box-shadow:0 0 9px rgba(211,188,142,.7)}

/* ---------- 揭示：碎片 / 剪影（可爱风：圆头彩屑 + 贴纸字） ---------- */
.card .shards{position:absolute;left:50%;top:42%;width:0;height:0;z-index:1;pointer-events:none}
.card .shards i{position:absolute;left:0;bottom:0;width:0;height:0;transform-origin:50% 100%}
.card .shards i b{position:absolute;left:50%;bottom:0;translate:-50% 0;display:block;border-radius:99px;opacity:0;
  transform-origin:50% 100%;
  animation:shardIn .62s cubic-bezier(.18,.82,.3,1) both}
@keyframes shardIn{0%{opacity:0;transform:scaleY(.18)}30%{opacity:1}100%{opacity:.34;transform:scaleY(1.32)}}
.card .artw::before{content:'';position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:-1;
  width:152%;height:120%;border-radius:50%;
  background:radial-gradient(closest-side, rgba(255,255,255,.4), rgba(255,255,255,.16) 55%, rgba(255,255,255,0) 80%)}
.card .silh{position:absolute;left:0;right:0;top:0;bottom:96px;z-index:3;display:grid;place-items:center;
  font-family:"YouYuan","幼圆","Yuanti SC","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  font-weight:700;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:9px;line-height:1;max-height:calc(100% - 12px);
  color:#fff;-webkit-text-stroke:10px rgba(150,168,154,.62);paint-order:stroke fill;
  animation:silhOut .52s .30s cubic-bezier(.4,0,.6,1) both}
@keyframes silhOut{from{opacity:1}to{opacity:0}}
.card .mono{animation:monoIn .52s .30s ease both}
@keyframes monoIn{from{opacity:0}to{opacity:1}}
.card.burst{animation:cardBurst .66s cubic-bezier(.14,.86,.3,1) both}
@keyframes cardBurst{0%{opacity:0;transform:scale(.64) rotate(-4deg);filter:brightness(1.9) saturate(.72)}
  58%{opacity:1;transform:scale(1.06) rotate(1.4deg);filter:brightness(1.14)}
  100%{opacity:1;transform:none;filter:none}}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;z-index:12000;background:rgba(3,6,13,.82);backdrop-filter:blur(5px);display:none}
.mask.on{display:block}
.modal{
  position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(880px,95vw);max-height:87vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#152039,#0b1226);border:1px solid rgba(211,188,142,.4);border-radius:6px;
  box-shadow:0 40px 90px -30px #000;overflow:hidden
}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid rgba(211,188,142,.2);flex:0 0 auto}
.mhd h3{font-family:"Songti SC","Noto Serif SC",serif;font-size:16px;letter-spacing:5px;color:var(--gold-l);font-weight:500}
.mclose{cursor:pointer;color:var(--txt-dim);font-size:20px;line-height:1;padding:0 4px}
.mclose:hover{color:var(--gold)}
.mtabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid rgba(211,188,142,.16);flex:0 0 auto}
.mtabs div{padding:10px 17px;font-size:13px;color:var(--txt-dim);cursor:pointer;border-bottom:2px solid transparent;letter-spacing:1px}
.mtabs div.on{color:var(--gold-l);border-bottom-color:var(--gold)}
.mbd{padding:16px 20px 22px;overflow:auto;flex:1 1 auto}
.mbd::-webkit-scrollbar{width:7px}
.mbd::-webkit-scrollbar-thumb{background:rgba(211,188,142,.35);border-radius:9px}
.tline{font-size:10.5px;color:var(--txt-dim);letter-spacing:1.5px;margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.tline:first-child{margin-top:0}
.tline::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(211,188,142,.35),transparent)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:10px;margin-bottom:16px}
.stat{background:rgba(211,188,142,.07);border:1px solid rgba(211,188,142,.22);border-radius:4px;padding:11px 13px}
.stat span{display:block;font-size:11px;color:var(--txt-dim);letter-spacing:1px}
.stat b{font-size:20px;color:var(--gold-l);font-variant-numeric:tabular-nums}
.hrow{display:grid;grid-template-columns:56px 1fr 66px 80px;gap:8px;align-items:center;padding:8px 6px;font-size:12.5px;
  border-bottom:1px solid rgba(255,255,255,.07)}
.hrow.head{color:var(--txt-dim);font-size:11px;letter-spacing:1px}
.hrow.r5{background:linear-gradient(90deg,rgba(217,149,47,.18),transparent)}
.hrow.r4{background:linear-gradient(90deg,rgba(154,109,215,.13),transparent)}
.hrow .tm{color:var(--txt-dim);font-size:11px;font-variant-numeric:tabular-nums}
.hrow .pt{color:var(--gold);font-variant-numeric:tabular-nums;font-size:11.5px}
.rk{font-weight:700;letter-spacing:0}
.rk.r5{color:var(--r5)}.rk.r4{color:var(--r4)}.rk.r3{color:var(--r3)}
.empty{text-align:center;color:var(--txt-dim);font-size:13px;padding:40px 0;letter-spacing:1px}

/* ---------- form ---------- */
.field{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
input[type=text],select,textarea{
  font-family:inherit;font-size:13px;color:var(--txt);background:rgba(4,8,18,.75);
  border:1px solid rgba(211,188,142,.28);border-radius:3px;padding:9px 11px;outline:none;transition:.18s
}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(211,188,142,.12)}
input[type=text]{flex:1 1 150px;min-width:0}
select{cursor:pointer}
textarea{width:100%;min-height:180px;line-height:1.85;resize:vertical;font-size:12.5px}
.mini{cursor:pointer;font-family:inherit;font-size:12px;letter-spacing:1px;padding:9px 17px;border-radius:3px;color:#241c08;
  background:linear-gradient(180deg,#f7edd0,#d8bf8b);border:none;font-weight:600;white-space:nowrap}
.mini:hover{filter:brightness(1.07)}
.mini.ghost{background:transparent;border:1px solid rgba(211,188,142,.45);color:var(--gold-l);font-weight:400}
.mini.ghost:hover{border-color:var(--gold);color:#fff}
.mini.danger{border-color:rgba(220,120,120,.5);color:#e89a9a}
.mini.danger:hover{border-color:#e88;color:#fff}
.hint{font-size:11.5px;color:var(--txt-dim);line-height:1.9;background:rgba(211,188,142,.06);
  border-left:2px solid rgba(211,188,142,.4);padding:10px 13px;border-radius:0 3px 3px 0;margin-bottom:12px}
.hint code{background:rgba(0,0,0,.4);padding:1px 5px;border-radius:2px;color:var(--gold-l);font-size:11.5px}

/* 数据导入 / 导出 */
.dpsum{border:1px solid rgba(211,188,142,.2);border-radius:5px;overflow:hidden;background:rgba(6,10,20,.5)}
.dpsum>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 14px;
  font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.055)}
.dpsum>div:last-child{border-bottom:none}
.dpsum>div>span{color:var(--txt-dim);letter-spacing:.5px;flex:0 0 auto}
.dpsum>div>b{color:#e8dcbc;font-weight:600;text-align:right;word-break:break-all}
.dpchip{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11px;
  background:rgba(255,255,255,.05);color:var(--txt-dim);border:1px solid rgba(255,255,255,.09)}
.dpchip.on{background:rgba(211,188,142,.14);color:var(--gold-l);border-color:rgba(211,188,142,.42)}
#dpConfirm .dpsum{margin-bottom:2px}

/* item list */
.ilist{border:1px solid rgba(211,188,142,.18);border-radius:4px;overflow:hidden}
.ihead,.irow{display:grid;grid-template-columns:78px 1fr 1fr 62px 36px;gap:8px;align-items:center;padding:8px 12px}
.ihead{font-size:11px;color:var(--txt-dim);letter-spacing:1px;background:rgba(211,188,142,.07);
  border-bottom:1px solid rgba(211,188,142,.18)}
.irow{border-bottom:1px solid rgba(255,255,255,.06);font-size:13px}
.irow:last-child{border-bottom:none}
.irow:hover{background:rgba(255,255,255,.025)}
.irow select{padding:4px 6px;font-size:12px}
.iname,.itag{padding:3px 6px;border-radius:3px;border:1px dashed transparent;outline:none;min-height:24px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.iname:hover,.itag:hover{border-color:rgba(211,188,142,.3)}
.iname:focus,.itag:focus{border-color:var(--gold);background:rgba(0,0,0,.4);white-space:normal;overflow:visible}
.itag{color:var(--txt-dim);font-size:12px}
.iup{cursor:pointer;font-size:11px;letter-spacing:1px;text-align:center;padding:4px 0;border-radius:3px;
  border:1px solid rgba(211,188,142,.3);color:var(--txt-dim);transition:.18s;user-select:none}
.iup.on{background:linear-gradient(180deg,#ffd76a,#d9952f);color:#2a1c04;border-color:#ffd76a;font-weight:700}
.idel{cursor:pointer;color:#7c869e;text-align:center;font-size:15px;user-select:none}
.idel:hover{color:#e88}
.bulkrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--txt-dim);cursor:pointer;user-select:none}
.chk input{accent-color:#d3bc8e;cursor:pointer}

/* ---------- 概率设置 ---------- */
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:11px}
.rgrid label{display:flex;align-items:center;justify-content:space-between;gap:9px;font-size:12.5px;color:#cbd5ea;
  background:rgba(255,255,255,.03);border:1px solid rgba(211,188,142,.18);border-radius:4px;padding:8px 11px}
.rgrid label input{width:76px;text-align:right;padding:5px 8px;font-variant-numeric:tabular-nums;font-size:12.5px;flex:0 0 auto}
.rgrid label em{font-style:normal;color:var(--txt-dim);font-size:11px}
.simbox{margin-top:13px;padding:12px 14px;border-radius:4px;font-size:12.5px;line-height:2;
  background:linear-gradient(180deg,rgba(94,148,235,.10),rgba(94,148,235,.03));
  border:1px solid rgba(94,148,235,.3);color:#cbd5ea}
.simbox b{color:var(--gold-l);font-variant-numeric:tabular-nums;font-size:14px}
.simbox i{font-style:normal;color:#8fa2c4;font-size:11px}
.wgroup{margin-bottom:14px}
.whead{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:2px;margin-bottom:7px;color:var(--txt-dim)}
.whead b{font-weight:400}
.whead .rk{letter-spacing:0}
.whead .wbtn2{margin-left:auto;cursor:pointer;font-size:11px;padding:3px 10px;border-radius:3px;
  border:1px solid rgba(211,188,142,.35);color:var(--gold);background:transparent;font-family:inherit}
.whead .wbtn2:hover{background:rgba(211,188,142,.14)}
.wrow{display:grid;grid-template-columns:minmax(90px,.85fr) minmax(140px,1.5fr) 78px 112px;gap:10px;align-items:center;padding:6px 4px;
  border-bottom:1px solid rgba(255,255,255,.06)}
.wrow:last-child{border-bottom:none}
.wrow .wn{font-size:12.5px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow input[type=range]{width:100%;accent-color:#d3bc8e;cursor:pointer;height:18px}
.wrow input[type=number]{width:100%;text-align:right;padding:4px 7px;font-size:12px;font-variant-numeric:tabular-nums}
.wrow .wp{font-size:12px;color:var(--gold-l);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.wrow .wp i{display:block;font-style:normal;font-size:10.5px;color:#7f8ba5}
@media (max-width:880px){
  .wrow{grid-template-columns:1fr 90px 58px;row-gap:2px}
  .wrow .wp{grid-column:1 / -1;text-align:left}
}

.toast{
  position:fixed;left:50%;bottom:42px;translate:-50% 0;z-index:15000;padding:11px 24px;border-radius:999px;
  background:rgba(6,11,22,.95);border:1px solid rgba(211,188,142,.45);color:var(--gold-l);font-size:13px;letter-spacing:1px;
  opacity:0;transition:.3s;pointer-events:none;box-shadow:0 12px 34px -12px #000
}
.toast.on{opacity:1;bottom:56px}

@media (max-width:880px){
  #rvGrid{grid-template-columns:repeat(5,62px);gap:7px}
  .gc{height:98px}
  .gc .gmono{font-size:28px}
  .card{width:216px;height:338px}
  .card .artw{bottom:88px}
  .topbar{padding:10px 14px;gap:8px;flex-wrap:wrap}
  .logo b{font-size:16px;letter-spacing:3px}
  .logo small{display:none}
  .tbtn{font-size:12px;padding:6px 12px;letter-spacing:1px;gap:5px}
  .ihead,.irow{grid-template-columns:64px 1fr 66px 52px 28px;padding:7px 9px;gap:6px}
  .ihead span:nth-child(3){display:none}
  .irow .itag{display:none}
}
</style>

    <svg class="chibi cTR back" viewBox="0 0 100 88" aria-hidden="true">
      <defs>
        <linearGradient id="nxHair" x1="26%" y1="0%" x2="74%" y2="100%">
          <stop offset="0%" stop-color="#ffffff"/>

<script>
/* =========================================================
   1. 配置
   ========================================================= */
const SAVE = 'wish-sim-v2';

/* 卡池：抽卡界面已移除，这里只保留概率分支所需的 type */
const BANNERS = [
  {id:'char', type:'char'},
  {id:'std',  type:'std'},
];

/* =========================================================
   2. 状态
   ========================================================= */
const state = {
  items: [],                      // {id,name,rarity,tag,up,weight}
  rates: null,                    // 见 RATES_DEFAULT
  meta: {
    char: {name:'「星轨之约」', sub:'活动祈愿。被标记为 UP 的对象将获得概率提升。'},
    std:  {name:'「万象常驻」', sub:'常驻祈愿。卡池内全部对象均可能获得。'},
  },
  owned: {},
  history: [],
  stats: {total:0, r5:0, r4:0, r3:0, sc:0, sd:0},
  pity: {},
  banner: 'char',
  /* 自定义壁纸（二进制存 IndexedDB，这里只存元信息） */
  wall: { src:'default', name:'', kind:'image', fit:'cover', blur:0, dim:46, vig:true, kb:false },
  audio: { on:true, vol:78 },
  /* 「祈愿」按钮外观：scale = 尺寸倍率 */
  /* scale = 尺寸倍率；skin = 自定义按钮皮肤（图片二进制存 IndexedDB） */
  btn: { scale: 1, skin: { on:false, fit:'cover', ratio:false, dim:14, radius:0, text:false, chibi:false, name:'', sv:2 } },
};
BANNERS.forEach(b=>{ state.pity[b.id] = {c5:0, c4:0, guar5:false, guar4:false}; });

function load(){
  let d = null;
  try{ const raw = localStorage.getItem(SAVE); if(raw) d = JSON.parse(raw); }catch(e){}
  if(d){
    Object.assign(state, d);
    delete state.gem; delete state.fates;   /* 货币体系已整体移除 */
    state.meta  = Object.assign({char:{name:'',sub:''},std:{name:'',sub:''}}, d.meta||{});
    state.stats = Object.assign({total:0,r5:0,r4:0,r3:0,sc:0,sd:0}, d.stats||{});
    BANNERS.forEach(b=>{ if(!state.pity[b.id]) state.pity[b.id]={c5:0,c4:0,guar5:false,guar4:false}; });
  }
  if(!Array.isArray(state.items)) state.items = [];
  if(!state.owned || typeof state.owned !== 'object') state.owned = {};
  if(!Array.isArray(state.history)) state.history = [];
  state.rates = Object.assign({}, RATES_DEFAULT, state.rates||{});
  Object.keys(RATES_DEFAULT).forEach(k=>{
    const v = Number(state.rates[k]);
    state.rates[k] = isFinite(v) ? v : RATES_DEFAULT[k];
  });
  state.items.forEach(i=>{ i.weight = isFinite(Number(i.weight)) ? Math.max(0, Number(i.weight)) : 1; });
  state.wall  = Object.assign({src:'default',name:'',kind:'image',fit:'cover',blur:0,dim:46,vig:true,kb:false}, state.wall||{});
  state.audio = Object.assign({on:true,vol:78}, state.audio||{});
  state.btn   = Object.assign({scale:1}, state.btn||{});
  state.btn.scale = clampBtnScale(state.btn.scale);
  const skinV = Number((state.btn.skin || {}).sv) || 1;   /* 没有版本号 = 旧版（v1） */
  state.btn.skin = Object.assign(
    { on:false, fit:'cover', ratio:false, dim:14, radius:0, text:false, chibi:false, name:'', sv:2 },
    state.btn.skin || {});
  if(!['cover','contain'].includes(state.btn.skin.fit)) state.btn.skin.fit = 'cover';
  state.btn.skin.on     = !!state.btn.skin.on;
  state.btn.skin.ratio  = !!state.btn.skin.ratio;
  state.btn.skin.text   = state.btn.skin.text  === true;
  state.btn.skin.chibi  = state.btn.skin.chibi === true;
  /* v1 的默认是「在图片上叠加按钮文字和小角色」——图片若自带文字就会重影。
     v2 改成「图片优先」，旧存档一次性跟随新默认；想叠加在面板里重新勾上即可。 */
  if(skinV < 2){ state.btn.skin.text = false; state.btn.skin.chibi = false; }
  state.btn.skin.sv = 2;
  state.btn.skin.dim    = Math.max(0, Math.min(70, Number(state.btn.skin.dim) || 0));
  state.btn.skin.radius = Math.max(0, Math.min(30, Number(state.btn.skin.radius) || 0));
  state.btn.skin.name   = String(state.btn.skin.name || '').slice(0, 40);
  if(!['cover','contain'].includes(state.wall.fit)) state.wall.fit = 'cover';
  if(!['image','video','camera'].includes(state.wall.kind)) state.wall.kind = 'image';
  state.wall.dim  = Math.max(0, Math.min(90, Number(state.wall.dim)||0));
  state.wall.blur = Math.max(0, Math.min(30, Number(state.wall.blur)||0));
}
function save(){ try{ localStorage.setItem(SAVE, JSON.stringify(state)); }catch(e){} }

/* ---------- 「祈愿」按钮尺寸：倍率夹取 + 应用 + 页脚避让 ---------- */
const BTN_SCALE_MIN = 0.6, BTN_SCALE_MAX = 1.5;
function clampBtnScale(v){
  const n = Number(v);
  if(!isFinite(n) || n <= 0) return 1;
  return Math.round(Math.min(BTN_SCALE_MAX, Math.max(BTN_SCALE_MIN, n)) * 100) / 100;
}
/* 把倍率写到 --sc，并按按钮实际占位决定页脚是「左对齐让位」还是「整体上抬」 */
function applyBtnScale(){
  const b = document.getElementById('p1');
  if(!b) return;
  b.style.setProperty('--sc', state.btn.scale);
  /* 尺寸变了，贴合图片比例的按钮高度要跟着重算（内部会同步页脚避让）。
     BSKIN 用 const 声明但 boot() 在 DOMContentLoaded 后才跑，此处必然已初始化。 */
  BSKIN.applyRatio();
}
function syncWishLayout(){
  const b = document.getElementById('p1'), wrap = document.querySelector('.wrap'), foot = document.querySelector('.foot');
  if(!b || !wrap || !foot) return;
  const r = b.getBoundingClientRect();
  const gapR = Math.max(0, window.innerWidth - r.right);
  /* 边框上趴着的小家伙向上溢出按钮，避让要按「按钮 + 小角色」的整体视觉并集算 */
  let top = r.top;
  b.querySelectorAll('.chibi').forEach(k=>{ const q = k.getBoundingClientRect(); if(q.top < top) top = q.top; });
  /* 页脚要空出的宽度 = 按钮宽 + 右侧留白 + 呼吸 */
  const reserve = Math.round(r.width + gapR + 28);
  const contentW = wrap.clientWidth - 40;            // 减去 .wrap 左右各 20px 内边距
  document.documentElement.style.setProperty('--wishReserve', reserve + 'px');
  /* 上抬量必须让页脚整体落在**视觉并集的上沿**之上（不是按钮底边，也不是按钮顶边——
     右上的小角色会探到按钮顶边之上）。小角色只在竖向上溢出，水平避让仍按按钮宽度算即可 */
  document.documentElement.style.setProperty('--wishLift', Math.round(window.innerHeight - top + 16) + 'px');
  /* 剩余可用宽度太窄（文字会挤成窄条）就改为把页脚整体抬到按钮带之上 */
  document.body.classList.toggle('wishlift', contentW - reserve < 260);
}

/* =========================================================
   3. 概率与抽卡（全部可调）
   ========================================================= */
const RATES_DEFAULT = {
  r5base:0.6,    // 五星基础概率 %
  r5soft:74,     // 开始提升的抽数
  r5step:6,      // 此后每抽提升 %
  r5hard:90,     // 硬保底抽数
  r4base:5.1,    // 四星基础概率 %
  r4soft:56.1,   // 四星第 (r4hard-1) 抽概率 %
  r4hard:10,     // 四星硬保底抽数
  up:50,         // 活动祈愿 UP 命中概率 %
};
function R(){ if(!state.rates) state.rates = Object.assign({}, RATES_DEFAULT); return state.rates; }
function rate5(n){
  const r = R();
  if(n >= r.r5hard) return 1;
  if(n < r.r5soft) return Math.min(1, r.r5base/100);
  return Math.min(1, r.r5base/100 + (n - r.r5soft + 1) * r.r5step/100);
}
function rate4(n){
  const r = R();
  if(n >= r.r4hard) return 1;
  if(n === r.r4hard - 1) return Math.min(1, r.r4soft/100);
  return Math.min(1, r.r4base/100);
}
const rnd = a => a[(Math.random()*a.length)|0];
const byR = r => state.items.filter(i=>i.rarity===r);
const has = r => state.items.some(i=>i.rarity===r);

/* 对象权重（同稀有度内按权重占比分配） */
function wOf(i){ const w = Number(i.weight); return (isFinite(w) && w >= 0) ? w : 1; }
const wsum = a => a.reduce((s,i)=>s+wOf(i), 0);
function pickW(arr){
  if(!arr || !arr.length) return null;
  const tot = wsum(arr);
  if(tot <= 0) return null;              // 全为 0 权重 → 该池无货，交由调用方回退
  let x = Math.random() * tot;
  for(const i of arr){ x -= wOf(i); if(x <= 0) return i; }
  return arr[arr.length-1];
}

function doPull(b){
  if(!state.items.length) return null;
  const p = state.pity[b.id];
  const upChance = R().up/100;
  const okR = r => state.items.some(i=>i.rarity===r && wOf(i) > 0);

  p.c5++; p.c4++;
  let rarity = Math.random() < rate5(p.c5) ? 5 : (Math.random() < rate4(p.c4) ? 4 : 3);
  if(!okR(rarity)) rarity = [5,4,3].find(okR);
  if(rarity === undefined) return null;

  const snapPity = p.c5;
  let item = null, usedUpBranch = false, splitUsed = false;

  if(rarity === 5 || rarity === 4){
    const all = byR(rarity);
    const ups = all.filter(i=>i.up && wOf(i) > 0);
    const offs = all.filter(i=>!i.up && wOf(i) > 0);
    const upOk = ups.length > 0, offOk = offs.length > 0;
    if(b.type === 'char' && upOk && offOk){
      const guar = (rarity === 5) ? p.guar5 : p.guar4;
      const useUp = guar || Math.random() < upChance;
      item = pickW(useUp ? ups : offs);
      usedUpBranch = useUp;
      splitUsed = true;
      if(!item) item = pickW(useUp ? offs : ups);       // 目标池权重被清零 → 走另一池
    } else {
      item = pickW(upOk && b.type === 'char' ? ups : all);
      if(!item) item = pickW(all);
      usedUpBranch = !!(item && item.up);
    }
  } else {
    item = pickW(byR(3));
    if(!item) item = pickW(state.items.filter(i=>wOf(i) > 0));
  }
  if(!item) return null;

  if(rarity === 5){
    p.c5 = 0;
    if(b.type === 'char') p.guar5 = splitUsed ? !usedUpBranch : !item.up;
  }
  if(rarity === 4){
    p.c4 = 0;
    if(b.type === 'char') p.guar4 = splitUsed ? !usedUpBranch : !item.up;
  }

  const isNew = !state.owned[item.id];
  state.owned[item.id] = (state.owned[item.id]||0) + 1;
  if(rarity===3) state.stats.sd += 15;
  else if(rarity===4) state.stats.sc += isNew ? 2 : 3;
  else state.stats.sc += isNew ? 10 : 25;

  state.stats.total++;
  state.stats['r'+rarity]++;
  state.history.unshift({id:item.id, b:b.id, r:rarity, t:Date.now(), p:snapPity, neu:isNew});
  if(state.history.length > 1200) state.history.length = 1200;
  return {...item, isNew, rarity};
}

/* 概率试算（蒙特卡洛） */
function simulate(N){
  let c5=0,c4=0,five=0,four=0,three=0,n5=0,n4=0;
  for(let i=0;i<N;i++){
    c5++; c4++;
    const r = Math.random() < rate5(c5) ? 5 : (Math.random() < rate4(c4) ? 4 : 3);
    if(r===5){ five++; n5+=c5; c5=0; }
    else if(r===4){ four++; n4+=c4; c4=0; }
    else three++;
  }
  return { N, five, four, three,
    p5: five/N, p4: four/N, p3: three/N,
    avg5: five? n5/five : 0, avg4: four? n4/four : 0,
    upRate: 1/(2 - Math.min(R().up,100)/100) };
}
function pullN(b, n){
  const out = [];
  for(let i=0;i<n;i++){ const r = doPull(b); if(r) out.push(r); }
  return out;
}

/* =========================================================
   4. 音效（WebAudio 合成）
   ========================================================= */
const SFX = {
  ctx:null, master:null, verb:null, wet:null, on:true, ready:false,
  _nb:null, _pad:null,

  init(){
    if(this.ready) return true;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) throw new Error('no AudioContext');
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.targetVol();
      this.master.connect(this.ctx.destination);

      /* 合成一段大教堂式的脉冲响应，做出视频里那种开阔的尾音 */
      const conv = this.ctx.createConvolver();
      conv.buffer = this.ir(3.4, 2.4);
      this.wet = this.ctx.createGain(); this.wet.gain.value = 0.5;
      conv.connect(this.wet); this.wet.connect(this.master);
      this.verb = conv;

      this.ready = true;
    }catch(e){ this.on = false; }
    return this.ready;
  },
  targetVol(){
    const a = state.audio || {};
    if(a.on === false) return 0;
    return Math.max(0, Math.min(1, (a.vol==null?78:a.vol)/100));
  },
  setVol(v){
    if(v != null && isFinite(v)){ if(!state.audio) state.audio = {}; state.audio.vol = Math.max(0, Math.min(100, v)); }
    if(this.master) this.master.gain.value = this.targetVol();
  },
  resume(){ if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  now(){ return this.ctx ? this.ctx.currentTime : 0; },

  ir(dur, decay){
    const c = this.ctx, n = Math.max(1, Math.floor(c.sampleRate*dur));
    const b = c.createBuffer(2, n, c.sampleRate);
    for(let ch=0; ch<2; ch++){
      const d = b.getChannelData(ch);
      for(let i=0;i<n;i++){
        const t = i/n;
        d[i] = (Math.random()*2-1) * Math.pow(1-t, decay) * (1 - Math.exp(-i/900));
      }
    }
    return b;
  },
  noiseBuf(){
    if(this._nb) return this._nb;
    const c = this.ctx, n = Math.floor(c.sampleRate*4);
    const b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2-1;
    this._nb = b; return b;
  },
  noise(){ const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf(); s.loop = true; return s; },
  send(node, wet){
    node.connect(this.master);
    if(wet > 0 && this.verb){
      const g = this.ctx.createGain(); g.gain.value = wet;
      node.connect(g); g.connect(this.verb);
    }
    return node;
  },
  /* 通用音量包络：t0 起，attack 到 peak，decay 后归零 */
  env(t0, peak, attack, decay, hold){
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002), t0+attack);
    if(hold) g.gain.setValueAtTime(Math.max(peak,0.0002), t0+hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+attack+(hold||0)+decay);
    return g;
  },
  bp(freq, q, t0, to, dur){
    const f = this.ctx.createBiquadFilter();
    f.type='bandpass'; f.Q.value = q;
    f.frequency.setValueAtTime(Math.max(freq,20), t0);
    if(to) f.frequency.exponentialRampToValueAtTime(Math.max(to,20), t0+dur);
    return f;
  },
  lp(cut, q){ const f=this.ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut; if(q) f.Q.value=q; return f; },
  hp(cut){ const f=this.ctx.createBiquadFilter(); f.type='highpass'; f.frequency.value=cut; return f; },
  osc(type, freq){ const o=this.ctx.createOscillator(); o.type=type; o.frequency.value=freq; return o; },

  /* 各音源可以随时“过期”：动画被打断后不再出声 */
  stale(t){ return !this.on || !this.ctx || t < this.ctx.currentTime - 0.02; },

  /* ---------- ① 界面点击 ---------- */
  click(){
    if(!this.on || !this.init()) return;
    const c=this.ctx, t=c.currentTime;
    const s=this.noise(), f=this.bp(2600,.9,t,1400,.06), g=this.env(t,.16,.004,.055);
    s.connect(f); f.connect(g); this.send(g,.25); s.start(t); s.stop(t+.1);
    const o=this.osc('sine',1500), og=this.env(t,.09,.003,.07);
    o.frequency.exponentialRampToValueAtTime(700,t+.07);
    o.connect(og); this.send(og,.2); o.start(t); o.stop(t+.1);
  },

  /* ---------- ② 蓄势：低频渐强 ---------- */
  charge(dur){
    dur = dur || 0.85;
    if(!this.on || !this.init()) return;
    const c=this.ctx, t=c.currentTime;
    const o=this.osc('sine',44), og=this.ctx.createGain();
    og.gain.setValueAtTime(0.0001,t);
    og.gain.linearRampToValueAtTime(0.34,t+dur*0.85);
    og.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.35);
    const lfo=this.osc('sine',5.5), lg=this.ctx.createGain(); lg.gain.value=3.2;
    lfo.connect(lg); lg.connect(o.frequency);
    o.connect(og); this.send(og,.18); o.start(t); o.stop(t+dur+0.4);
    lfo.start(t); lfo.stop(t+dur+0.4);

    const s=this.noise(), f=this.lp(180,3), fg=this.ctx.createGain();
    f.frequency.setValueAtTime(120,t); f.frequency.exponentialRampToValueAtTime(1100,t+dur);
    fg.gain.setValueAtTime(0.0001,t);
    fg.gain.linearRampToValueAtTime(0.22,t+dur*0.9);
    fg.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.3);
    s.connect(f); f.connect(fg); this.send(fg,.3); s.start(t); s.stop(t+dur+0.35);

    const up=this.osc('triangle',90), ug=this.ctx.createGain();
    up.frequency.exponentialRampToValueAtTime(300,t+dur);
    ug.gain.setValueAtTime(0.0001,t);
    ug.gain.linearRampToValueAtTime(0.055,t+dur*0.9);
    ug.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.25);
    up.connect(ug); this.send(ug,.45); up.start(t); up.stop(t+dur+0.3);
  },

  /* ---------- ③ 白光冲刷 ---------- */
  wash(dur){
    dur = dur || 0.95;
    if(!this.on || !this.init()) return;
    const c=this.ctx, t=c.currentTime;
    const s=this.noise(), f=this.bp(320,1.0,t,5200,dur*0.72), g=this.env(t,.30,.26,dur*0.55,.04);
    s.connect(f); f.connect(g); this.send(g,.55); s.start(t); s.stop(t+dur+.4);

    const s2=this.noise(), f2=this.hp(2600), g2=this.ctx.createGain();
    g2.gain.setValueAtTime(0.0001,t);
    g2.gain.linearRampToValueAtTime(0.10,t+dur*0.5);
    g2.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.5);
    s2.connect(f2); f2.connect(g2); this.send(g2,.7); s2.start(t); s2.stop(t+dur+.55);

    const o=this.osc('sine',1500), og=this.ctx.createGain();
    o.frequency.exponentialRampToValueAtTime(4200,t+dur*0.7);
    og.gain.setValueAtTime(0.0001,t);
    og.gain.linearRampToValueAtTime(0.045,t+dur*0.5);
    og.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.3);
    o.connect(og); this.send(og,.6); o.start(t); o.stop(t+dur+.35);
  },

  /* ---------- ④ 云涡流转 ---------- */
  vortex(dur){
    dur = dur || 1.05;
    if(!this.on || !this.init()) return;
    const c=this.ctx, t=c.currentTime;
    const s=this.noise(), f=this.lp(750,1.6), g=this.ctx.createGain();
    const lfo=this.osc('sine',.68), lg=this.ctx.createGain(); lg.gain.value=420;
    lfo.connect(lg); lg.connect(f.frequency);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(0.26,t+dur*.3);
    g.gain.linearRampToValueAtTime(0.0001,t+dur+.45);
    s.connect(f); f.connect(g); this.send(g,.5); s.start(t); s.stop(t+dur+.5);
    lfo.start(t); lfo.stop(t+dur+.5);

    const r=this.osc('sine',58), rg=this.ctx.createGain();
    r.frequency.exponentialRampToValueAtTime(40,t+dur);
    rg.gain.setValueAtTime(0.0001,t);
    rg.gain.linearRampToValueAtTime(0.30,t+dur*.35);
    rg.gain.exponentialRampToValueAtTime(0.0001,t+dur+.4);
    r.connect(rg); this.send(rg,.25); r.start(t); r.stop(t+dur+.45);

    const s3=this.noise(), f3=this.bp(420,1.7,t,1900,dur), g3=this.env(t,.16,.3,dur*.5,0);
    s3.connect(f3); f3.connect(g3); this.send(g3,.65); s3.start(t); s3.stop(t+dur+.3);
  },

  /* ---------- ⑤ 流星「咻」 ---------- */
  meteor(i){
    if(!this.on || !this.init()) return;
    const c=this.ctx, t=c.currentTime;
    const v = (i||0) % 5;
    const f0 = 4600 + v*260, f1 = 380 + v*40;
    const s=this.noise(), f=this.bp(f0,3.2,t,f1,.34), g=this.env(t,.19,.035,.36,.02);
    s.connect(f); f.connect(g); this.send(g,.7); s.start(t); s.stop(t+.75);

    const s2=this.noise(), f2=this.bp(f0*0.6,1.1,t,f1*0.5,.4), g2=this.env(t,.10,.06,.42,0);
    s2.connect(f2); f2.connect(g2); this.send(g2,.85); s2.start(t); s2.stop(t+.8);
  },

  /* ---------- ⑥ 星光铃（FM 钟） ---------- */
  sparkle(freq, vol, len){
    if(!this.on || !this.init()) return;
    const c=this.ctx, t=c.currentTime;
    const f = freq || 2400, dur = len || 1.5;
    const car=this.osc('sine',f), mod=this.osc('sine',f*2.76);
    const mi=this.ctx.createGain();
    mi.gain.setValueAtTime(f*2.1,t);
    mi.gain.exponentialRampToValueAtTime(f*0.05,t+dur*0.35);
    mod.connect(mi); mi.connect(car.frequency);
    const g=this.env(t,(vol==null?0.075:vol),0.004,dur,0);
    car.connect(g); this.send(g,.85);
    car.start(t); car.stop(t+dur+.2); mod.start(t); mod.stop(t+dur+.2);
    /* 铃芯的高频击打 */
    const s=this.noise(), f2=this.hp(5200), g2=this.env(t,.028,.003,.09);
    s.connect(f2); f2.connect(g2); this.send(g2,.5); s.start(t); s.stop(t+.15);
  },

  /* ---------- ⑦ 爆发冲击 ---------- */
  burst(heavy){
    if(!this.on || !this.init()) return;
    const c=this.ctx, t=c.currentTime;
    const o=this.osc('sine', heavy?118:96), og=this.ctx.createGain();
    o.frequency.exponentialRampToValueAtTime(30,t+.62);
    og.gain.setValueAtTime(heavy?0.62:0.40,t);
    og.gain.exponentialRampToValueAtTime(0.0001,t+.85);
    o.connect(og); this.send(og,.22); o.start(t); o.stop(t+.9);

    const s=this.noise(), f=this.lp(heavy?6800:4600,1.1), g=this.env(t,heavy?0.46:0.30,.008,.6,0);
    s.connect(f); f.connect(g); this.send(g,.55); s.start(t); s.stop(t+.75);

    const up=this.osc('sine',190), ug=this.ctx.createGain();
    up.frequency.exponentialRampToValueAtTime(2100,t+.34);
    ug.gain.setValueAtTime(0.0001,t);
    ug.gain.linearRampToValueAtTime(0.11,t+.12);
    ug.gain.exponentialRampToValueAtTime(0.0001,t+.55);
    up.connect(ug); this.send(ug,.5); up.start(t); up.stop(t+.6);
  },

  /* ---------- ⑧ 光柱升起 ---------- */
  pillar(dur){
    dur = dur || 1.25;
    if(!this.on || !this.init()) return;
    const c=this.ctx, t=c.currentTime;
    const s=this.noise(), f=this.bp(460,1.3,t,4200,dur), g=this.env(t,.24,.35,dur*.55,.05);
    s.connect(f); f.connect(g); this.send(g,.75); s.start(t); s.stop(t+dur+.5);
    const r=this.osc('sine',64), rg=this.ctx.createGain();
    rg.gain.setValueAtTime(.0001,t);
    rg.gain.linearRampToValueAtTime(0.22,t+dur*.4);
    rg.gain.exponentialRampToValueAtTime(.0001,t+dur+.4);
    r.connect(rg); this.send(rg,.3); r.start(t); r.stop(t+dur+.45);
  },

  /* ---------- ⑨ 揭示重击 ---------- */
  reveal(rar){
    if(!this.on || !this.init()) return;
    const c=this.ctx, t=c.currentTime;
    const o=this.osc('sine',142), og=this.ctx.createGain();
    o.frequency.exponentialRampToValueAtTime(27,t+.7);
    og.gain.setValueAtTime(0.72,t);
    og.gain.exponentialRampToValueAtTime(0.0001,t+1.0);
    o.connect(og); this.send(og,.24); o.start(t); o.stop(t+1.05);

    const s=this.noise(), f=this.lp(7800,1.0), g=this.env(t,0.52,.006,.72,0);
    s.connect(f); f.connect(g); this.send(g,.6); s.start(t); s.stop(t+.9);

    const s2=this.noise(), f2=this.hp(3000), g2=this.env(t,0.24,.01,.5,0);
    s2.connect(f2); f2.connect(g2); this.send(g2,.8); s2.start(t); s2.stop(t+.65);

    /* 上行琶音（五声音阶），稀有度越高越长 */
    const base = 523.25;
    const scale = rar===5 ? [0,2,4,7,9,12,14,16,19] : rar===4 ? [0,2,4,7,9,12] : [0,4,7];
    scale.forEach((semi,i)=>{
      const fr = base*Math.pow(2, semi/12);
      const d = 0.05 + i*0.055;
      const tt = t + d;
      const oc=this.osc(rar===5?'triangle':'sine', fr);
      const gg=this.env(tt, rar===5?0.13:0.10, 0.006, rar===5?1.9:1.1, 0);
      oc.connect(gg); this.send(gg,.9); oc.start(tt); oc.stop(tt+2.3);
    });
  },

  /* ---------- ⑩ 卡片成立铃声 ---------- */
  chime(rarity){
    if(!this.on || !this.init()) return;
    const t0 = this.ctx.currentTime + 0.02;
    const seq = rarity===5?[523.25,659.25,783.99,1046.5,1318.5,1568,2093]
              : rarity===4?[523.25,659.25,783.99,1046.5]:[392,523.25];
    seq.forEach((fr,i)=>{
      const t=t0+i*0.08;
      const o=this.osc(rarity===5?'triangle':'sine', fr);
      const g=this.env(t, rarity===5?0.15:0.10, 0.008, rarity===5?1.6:0.85, 0);
      o.connect(g); this.send(g,.9); o.start(t); o.stop(t+2.2);
    });
    if(rarity===5){
      const s=this.noise(), f=this.hp(2600), g=this.ctx.createGain();
      g.gain.setValueAtTime(0.001,t0); g.gain.linearRampToValueAtTime(0.08,t0+0.35);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+1.9);
      s.connect(f); f.connect(g); this.send(g,.8); s.start(t0); s.stop(t0+1.95);
    }
  },

  /* ---------- ⑪ 余韵（稀疏铃声） ---------- */
  settle(rar){
    if(!this.on || !this.init()) return;
    const n = rar===5?7:rar===4?5:3;
    for(let i=0;i<n;i++){
      const d = 0.12 + i*0.29 + Math.random()*0.1;
      setTimeout(()=>{ if(this.on) this.sparkle(1500+Math.random()*2600, 0.05, 1.4); }, d*1000);
    }
  },

  /* ---------- ⑫ 持续氛围垫（模拟视频里的音乐床） ---------- */
  padOn(){
    if(!this.on || !this.init() || this._pad) return;
    const c=this.ctx, t=c.currentTime;
    const out=this.ctx.createGain(); out.gain.setValueAtTime(0.0001,t);
    out.gain.linearRampToValueAtTime(0.075,t+1.4);
    const flt=this.lp(760,0.9); flt.connect(out);
    /* A 大三和弦 + 九度，柔和三角波，慢速失谐 */
    [110, 164.81, 220, 277.18, 329.63, 440].forEach((f,i)=>{
      const o=this.osc('triangle', f*(1+(i%2?0.0018:-0.0018)));
      const g=this.ctx.createGain(); g.gain.value = i>3?0.30:0.52;
      o.connect(g); g.connect(flt); o.start(t);
      const lfo=this.osc('sine',0.09+i*0.031), lg=this.ctx.createGain(); lg.gain.value=0.16;
      lfo.connect(lg); lg.connect(g.gain); lfo.start(t);
      (this._padOsc||(this._padOsc=[])).push(o,lfo);
    });
    const trem=this.osc('sine',0.24), tg=this.ctx.createGain(); tg.gain.value=0.028;
    trem.connect(tg); tg.connect(out.gain); trem.start(t);
    this._padOsc.push(trem);
    this.send(out,.85);
    this._pad = out;
  },
  padOff(fade){
    if(!this._pad) return;
    const c=this.ctx, t=c.currentTime, f=fade||1.1;
    const g=this._pad;
    try{ g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(Math.max(g.gain.value,0.0001),t);
      g.gain.exponentialRampToValueAtTime(0.0001,t+f); }catch(e){}
    const oscs=this._padOsc||[]; 
    setTimeout(()=>{ oscs.forEach(o=>{ try{o.stop();}catch(e){} }); this._padOsc=[]; }, (f+0.25)*1000);
    this._pad = null;
  }
};

/* =========================================================
   5. 自定义壁纸（静态图片 / 动态视频 / 实时相机）
   ========================================================= */
const WALL_DEFAULT = { src:'default', name:'', kind:'image', fit:'cover', blur:0, dim:46, vig:true, kb:false };

const WALL = {
  db:null, objUrl:null, liveStream:null, camStream:null, camFacing:'user', camOk:false,

  /* ---------- IndexedDB（壁纸二进制放这里，localStorage 装不下） ---------- */
  open(){
    return new Promise(res=>{
      if(this.db) return res(this.db);
      let rq;
      try{ rq = indexedDB.open('wishsim-wall', 1); }catch(e){ return res(null); }
      rq.onupgradeneeded = ()=>{ const d = rq.result; if(!d.objectStoreNames.contains('wall')) d.createObjectStore('wall'); };
      rq.onsuccess = ()=>{ this.db = rq.result; res(this.db); };
      rq.onerror = ()=>res(null);
    });
  },
  async put(key, val){
    const db = await this.open(); if(!db) return false;
    return new Promise(res=>{
      try{
        const tx = db.transaction('wall','readwrite');
        tx.objectStore('wall').put(val, key);
        tx.oncomplete = ()=>res(true); tx.onerror = ()=>res(false);
      }catch(e){ res(false); }
    });
  },
  async get(key){
    const db = await this.open(); if(!db) return null;
    return new Promise(res=>{
      try{
        const tx = db.transaction('wall','readonly');
        const rq = tx.objectStore('wall').get(key);
        rq.onsuccess = ()=>res(rq.result || null); rq.onerror = ()=>res(null);
      }catch(e){ res(null); }
    });
  },
  async del(key){
    const db = await this.open(); if(!db) return;
    try{ db.transaction('wall','readwrite').objectStore('wall').delete(key); }catch(e){}
  },

  /* ---------- DOM ---------- */
  el(){ return document.getElementById('wallLayer'); },
  img(){ return document.getElementById('wallImg'); },
  vid(){ return document.getElementById('wallVid'); },

  /* ---------- 启动 ---------- */
  async boot(){
    this.paint();
    if(state.wall.src !== 'custom') return;
    if(state.wall.kind === 'camera'){        // 实时相机无法跨会话保留
      state.wall = Object.assign({}, WALL_DEFAULT);
      this.paint(); return;
    }
    const rec = await this.get('current');
    if(rec && rec.blob){ this.attach(rec.blob, rec.kind); this.objUrl && this.paint(); }
    else { state.wall = Object.assign({}, WALL_DEFAULT); this.paint(); }
  },

  /* ---------- 套用资源 ---------- */
  attach(blob, kind){
    const L = this.el(); if(!L) return;
    this.stopLive();
    if(this.objUrl){ try{ URL.revokeObjectURL(this.objUrl); }catch(e){} this.objUrl = null; }
    if(!blob){ this.img().removeAttribute('src'); this.vid().removeAttribute('src'); this.paint(); return; }
    this.objUrl = URL.createObjectURL(blob);
    if(kind === 'video'){
      const v = this.vid(); v.src = this.objUrl; v.loop = true; v.muted = true;
      L.classList.add('video'); v.play().catch(()=>{});
    } else {
      this.img().src = this.objUrl; L.classList.remove('video');
    }
    this.paint();
  },

  /* ---------- 渲染当前配置 ---------- */
  paint(){
    const L = this.el(); if(!L) return;
    const w = state.wall;
    const custom = w.src === 'custom' && (!!this.objUrl || !!this.liveStream);
    document.body.classList.toggle('has-wall', custom);
    L.classList.toggle('video', w.kind === 'video' || (w.kind === 'camera' && !!this.liveStream));
    L.classList.toggle('contain', w.fit === 'contain');
    L.classList.toggle('kb', !!w.kb && w.kind === 'image');
    L.classList.toggle('vig', !!w.vig);
    const veil = document.getElementById('wallVeil');
    if(veil) veil.style.background = 'rgba(4,8,18,' + ((w.dim||0)/100) + ')';
    /* 注意：filter 简写只接受滤镜函数，scale() 属于 transform —— 必须分开写，
       否则整条声明非法，会被浏览器静默丢弃（模糊就完全不生效）。 */
    const f  = w.blur ? 'blur(' + w.blur + 'px)' : '';
    const sc = w.blur ? 'scale(1.07)' : '';   // 放大一点，避免模糊后边缘露白
    this.img().style.filter = f;  this.img().style.transform = sc;
    this.vid().style.filter = f;  this.vid().style.transform = sc;
    if(w.kind === 'camera' && this.liveStream){
      const v = this.vid();
      if(v.srcObject !== this.liveStream){ v.srcObject = this.liveStream; v.play().catch(()=>{}); }
    }
  },

  /* ---------- 从相册 / 文件 ---------- */
  pick(kind){
    const inp = document.getElementById(kind === 'album' ? 'wallFile' : 'wallCam');
    if(!inp) return;
    inp.value = '';
    inp.click();
  },
  async useFile(file){
    if(!file) return;
    const type = (file.type || '').toLowerCase();
    let isVid = type.startsWith('video');
    if(!type && /\.(mp4|webm|mov|m4v|ogv)$/i.test(file.name||'')) isVid = true;
    if(!type && /\.(gif)$/i.test(file.name||'')) isVid = false;   // GIF 交给 <img> 自己动
    if(file.size > 120*1024*1024){ toast('文件过大（超过 120MB），请换一个小一些的'); return; }
    await this.commit(file, isVid ? 'video' : 'image', file.name || '自定义背景');
  },
  async commit(blob, kind, name){
    this.stopLive();
    state.wall = Object.assign({}, WALL_DEFAULT, state.wall, { src:'custom', kind, name });
    await this.put('current', { blob, kind, name, t:Date.now() });
    this.attach(blob, kind);
    save();
    if(mTab === 'wall') paintManager();
  },

  /* ---------- 相机 ---------- */
  camSupport(){
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  },
  async camStart(facing){
    if(!this.camSupport()) return { ok:false, msg:'当前环境不支持相机调用（需要以浏览器打开本地文件，或使用 https 访问）' };
    this.camStop();
    try{
      this.camStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing === 'environment' ? {ideal:'environment'} : {ideal:'user'},
                 width:{ ideal:1920 }, height:{ ideal:1080 } },
        audio: false
      });
      this.camFacing = facing || 'user';
      this.camOk = true;
      return { ok:true };
    }catch(e){
      const n = (e && e.name) || '';
      const msg = n === 'NotAllowedError' || n === 'SecurityError' ? '相机权限被拒绝或不可用。请在浏览器地址栏的权限设置里允许摄像头，或改用「从相册选择」。'
                : n === 'NotFoundError' || n === 'DevicesNotFoundError' ? '没有检测到可用的摄像头。'
                : n === 'NotReadableError' ? '摄像头被其他程序占用，请关闭后重试。'
                : ('相机启动失败：' + (n || (e && e.message) || '未知错误'));
      return { ok:false, msg };
    }
  },
  camStop(){
    if(this.camStream){ this.camStream.getTracks().forEach(t=>{ try{t.stop();}catch(e){} }); this.camStream = null; }
    this.camOk = false;
  },
  stopLive(){
    if(this.liveStream){
      this.liveStream.getTracks().forEach(t=>{ try{t.stop();}catch(e){} });
      this.liveStream = null;
      const v = this.vid(); if(v) v.srcObject = null;
    }
  },
  async camShot(srcId){
    const v = document.getElementById(srcId || 'camPrev');
    if(!v || !v.videoWidth) return null;
    const W = v.videoWidth, H = v.videoHeight;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    if(this.camFacing === 'user'){ g.translate(W,0); g.scale(-1,1); }
    g.drawImage(v,0,0,W,H);
    return await new Promise(res=> cv.toBlob(b=>res(b), 'image/jpeg', 0.92));
  },
  async camToWall(){
    if(!this.camStream){ const r = await this.camStart(this.camFacing); if(!r.ok){ toast(r.msg); return; } }
    this.stopLive();
    this.liveStream = this.camStream; this.camStream = null;
    state.wall = Object.assign({}, WALL_DEFAULT, state.wall, { src:'custom', kind:'camera', name:'实时相机画面' });
    const v = this.vid();
    v.srcObject = this.liveStream; v.muted = true; v.play().catch(()=>{});
    this.el().classList.add('video');
    this.paint(); save();
    toast('已使用相机实时画面作为动态壁纸（仅本次会话有效）');
  },

  /* ---------- 重置 ---------- */
  async reset(){
    this.stopLive();
    state.wall = Object.assign({}, WALL_DEFAULT);
    await this.del('current');
    this.attach(null);
    save();
    if(mTab === 'wall') paintManager();
  }
};

/* =========================================================
   5b. 「祈愿」按钮皮肤（相册 / 相机图片替代横幅外观）
   二进制复用 WALL 的 IndexedDB（同一个库里换 key），元信息存 state.btn.skin
   ========================================================= */
const BSKIN = {
  objUrl:null, native:{ w:0, h:0 },

  el(){  return document.getElementById('btnSkin'); },
  btn(){ return document.getElementById('p1'); },

  /* ---------- 启动：读取存档里的皮肤 ---------- */
  async boot(){
    this.apply();
    if(!state.btn.skin.on) return;
    const rec = await WALL.get('btnskin');
    if(rec && rec.blob){ this.attach(rec.blob); }
    else { state.btn.skin.on = false; state.btn.skin.name = ''; this.apply(); }
  },

  /* ---------- 读图片宽高比（判断是不是「整张按钮图」） ---------- */
  aspectOf(blob){
    return new Promise(res=>{
      let url = '';
      try{ url = URL.createObjectURL(blob); }catch(e){ return res(0); }
      const im  = new Image();
      const end = a => { try{ URL.revokeObjectURL(url); }catch(e){} res(a); };
      im.onload  = ()=> end(im.naturalHeight ? im.naturalWidth / im.naturalHeight : 0);
      im.onerror = ()=> end(0);
      im.src = url;
    });
  },

  /* ---------- 套用图片 ---------- */
  attach(blob){
    const im = this.el(); if(!im) return;
    if(this.objUrl){ try{ URL.revokeObjectURL(this.objUrl); }catch(e){} this.objUrl = null; }
    this.native = { w:0, h:0 };
    if(!blob){ im.onload = null; im.onerror = null; im.removeAttribute('src'); return; }
    this.objUrl = URL.createObjectURL(blob);
    im.onload  = ()=>{ this.native = { w:im.naturalWidth || 0, h:im.naturalHeight || 0 }; this.applyRatio(); };
    /* 图片损坏 / 格式不支持时自动退回默认皮肤，别让按钮变成一块空白 */
    im.onerror = async ()=>{ await this.reset(); toast('这张图片无法读取，已换成默认皮肤'); };
    im.src = this.objUrl;
  },

  async useFile(file){
    if(!file) return;
    if(!(file.type || '').startsWith('image')){ toast('按钮皮肤目前只支持图片'); return; }
    if(file.size > 24*1024*1024){ toast('图片过大（超过 24MB），请换一张小一些的'); return; }
    await this.commit(file, file.name || '自定义皮肤');
  },

  async commit(blob, name){
    state.btn.skin.on   = true;
    state.btn.skin.name = name || '自定义皮肤';
    /* 宽横幅图（≥2.2:1）多半就是一张「整张按钮图」，自带文字与图案：
       这时再叠上我们的文字和小角色就是重影，自动关掉；普通照片则保留叠加。 */
    const ar = await this.aspectOf(blob);
    const wide = ar > 0 && ar >= 2.2;
    if(ar > 0){
      state.btn.skin.text  = !wide;
      state.btn.skin.chibi = !wide;
    }
    await WALL.put('btnskin', { blob, name: state.btn.skin.name, t:Date.now() });
    this.attach(blob);
    this.apply();
    save();
    if(mTab === 'btn') this.mountPanel();
    toast(wide ? '已换上皮肤：图片自带文字，已自动去掉叠加图层' : '已换上自定义按钮皮肤');
  },

  async reset(){
    state.btn.skin.on   = false;
    state.btn.skin.name = '';
    await WALL.del('btnskin');
    this.attach(null);
    this.apply();
    save();
    if(mTab === 'btn') this.mountPanel();
    toast('已恢复默认按钮皮肤');
  },

  /* ---------- 应用外观（class / CSS 变量） ---------- */
  apply(){
    const b = this.btn(); if(!b) return;
    const s = state.btn.skin;
    b.classList.toggle('skinned', !!s.on);
    b.classList.toggle('notext',  !!s.on && !s.text);
    b.classList.toggle('nochibi', !!s.on && !s.chibi);
    b.style.setProperty('--sko', String(Math.max(0, Math.min(70, s.dim||0)) / 100));
    b.style.setProperty('--skr', Math.round(Math.max(0, Math.min(30, s.radius||0))) + 'px');
    const im = this.el();
    if(im) im.classList.toggle('fitcontain', s.fit === 'contain');
    this.applyRatio();
  },

  /* ---------- 贴合图片比例：调 --hr 让按钮高度匹配图片宽高比 ----------
     按钮基础比例 = --w0/--h0（约 4.21:1）远宽于普通照片，
     所以 hr = 4.21 / aspect；夹在 [0.72, 1.9] 以内，避免按钮高过视口。 */
  applyRatio(){
    const b = this.btn(); if(!b) return;
    const s = state.btn.skin;
    if(!(s.on && s.ratio && this.native.h > 0)){
      b.style.removeProperty('--hr');
      syncWishLayout();
      return;
    }
    const cs   = getComputedStyle(b);
    const h0   = parseFloat(cs.getPropertyValue('--h0')) || 96;
    const wNow = b.getBoundingClientRect().width || 1;
    const aspect = this.native.w / this.native.h;
    const hr = Math.max(0.72, Math.min(1.9, wNow / (aspect * h0 * (state.btn.scale || 1))));
    b.style.setProperty('--hr', String(Math.round(hr * 1000) / 1000));
    syncWishLayout();
  },

  /* ---------- 从相册 / 系统相机 ---------- */
  pick(kind){
    const inp = document.getElementById(kind === 'camera' ? 'skinCam' : 'skinFile');
    if(!inp) return;
    inp.value = '';
    inp.click();
  },

  /* ---------- 相机实时预览 ---------- */
  async renderCamBox(){
    const box = document.getElementById('skinCamBox');
    if(!box) return;
    box.innerHTML = `
      <div class="tline">相机实时预览</div>
      <div class="camwrap">
        <video id="skinCamPrev" autoplay muted playsinline style="--mir:${WALL.camFacing==='user'?-1:1}"></video>
        <div class="cmsg" id="skinCamMsg">正在请求相机权限…</div>
      </div>
      <div class="camrow">
        <button class="mini" id="skinCamShot">拍照设为皮肤</button>
        <button class="mini ghost" id="skinCamFlip">切换前后摄像头</button>
        <button class="mini ghost" id="skinCamOff">关闭相机</button>
      </div>
      <div class="hint" style="margin-top:10px">浏览器若不允许调用相机，可改用「从相册选择」，或点上面的按钮调起系统相机拍照。</div>`;
    const v   = document.getElementById('skinCamPrev');
    const msg = document.getElementById('skinCamMsg');
    const r   = await WALL.camStart(WALL.camFacing);
    const cmsg = document.getElementById('skinCamMsg');
    if(!r.ok){
      if(cmsg) cmsg.textContent = r.msg;
      if(v) v.style.display = 'none';
    } else {
      if(cmsg) cmsg.remove();
      v.srcObject = WALL.camStream;
      v.style.setProperty('--mir', WALL.camFacing === 'user' ? -1 : 1);
      v.play().catch(()=>{});
    }
    const g = id => document.getElementById(id);
    if(g('skinCamShot')) g('skinCamShot').onclick = async ()=>{
      SFX.click();
      const blob = await WALL.camShot('skinCamPrev');
      if(!blob){ toast('拍照失败，请稍后重试'); return; }
      await this.commit(blob, '相机拍摄');
    };
    if(g('skinCamFlip')) g('skinCamFlip').onclick = async ()=>{
      WALL.camFacing = WALL.camFacing === 'user' ? 'environment' : 'user';
      await this.renderCamBox();
    };
    if(g('skinCamOff')) g('skinCamOff').onclick = ()=>this.camOff();
  },
  camOff(){
    WALL.camStop();
    const box = document.getElementById('skinCamBox');
    if(box) box.innerHTML = '';
  },

  /* ---------- 面板里的预览 ---------- */
  mountPanel(){
    const prev = document.getElementById('skprev');
    if(prev){
      prev.innerHTML = '';
      if(state.btn.skin.on && this.objUrl){
        const im = document.createElement('img');
        im.src = this.objUrl;
        im.style.objectFit = state.btn.skin.fit === 'contain' ? 'contain' : 'cover';
        im.style.borderRadius = Math.round(state.btn.skin.radius || 0) + 'px';
        prev.appendChild(im);
        const veil = document.createElement('div');
        veil.style.cssText = 'position:absolute;inset:0;background:rgba(5,8,15,' +
          ((state.btn.skin.dim || 0) / 100) + ');border-radius:' + Math.round(state.btn.skin.radius || 0) + 'px';
        prev.appendChild(veil);
      } else {
        const ph = document.createElement('div');
        ph.className = 'ph';
        ph.textContent = '默认皮肤（薄荷奶绿横幅）';
        prev.appendChild(ph);
      }
    }
    const cur = document.getElementById('skCur');
    if(cur) cur.textContent = state.btn.skin.on ? (state.btn.skin.name || '自定义皮肤') : '默认（薄荷奶绿横幅）';
  }
};

/* =========================================================
   5c. 数据导入 / 导出（整机备份）
   ---------------------------------------------------------
   导出一个 .wishbackup 单文件（本质是 JSON）：既含 localStorage 里的
   全部配置，也把 IndexedDB 里的壁纸 / 按钮皮肤二进制转成 base64 内嵌，
   所以「换一台电脑」也能把整个状态原样搬过去。

   导入前会做一遍结构校验，再让用户选「覆盖」还是「合并」。
   ========================================================= */
const DATA_VER = 1;                 /* 备份格式版本 */
const DATA_EXT = '.wishbackup';     /* 自定义后缀，避免被当成普通 json 误开 */

const DataPort = {
  /* ---------- blob <-> base64 ---------- */
  blobToB64(blob){
    return new Promise((res, rej)=>{
      const fr = new FileReader();
      fr.onload  = ()=>{ const s = String(fr.result||''); res(s.slice(s.indexOf(',')+1)); };
      fr.onerror = ()=>rej(fr.error);
      fr.readAsDataURL(blob);
    });
  },
  b64ToBlob(b64, type){
    try{
      const bin = atob(b64);
      const len = bin.length;
      const u8  = new Uint8Array(len);
      for(let i=0;i<len;i++) u8[i] = bin.charCodeAt(i);
      return new Blob([u8], { type: type || 'application/octet-stream' });
    }catch(e){ return null; }
  },

  /* ---------- 打包：把当前全部数据收成一个对象 ---------- */
  async pack(){
    const d = JSON.parse(JSON.stringify({
      items:   state.items,
      rates:   state.rates,
      meta:    state.meta,
      owned:   state.owned,
      history: state.history,
      stats:   state.stats,
      pity:    state.pity,
      banner:  state.banner,
      wall:    state.wall,
      audio:   state.audio,
      btn:     state.btn,
    }));

    const assets = {};

    /* 自定义壁纸二进制（camera 类型本来就跨不了会话，不导） */
    if(state.wall.src === 'custom' && state.wall.kind !== 'camera'){
      const rec = await WALL.get('current');
      if(rec && rec.blob){
        assets.wall = {
          b64:  await this.blobToB64(rec.blob),
          type: rec.blob.type || (rec.kind === 'video' ? 'video/mp4' : 'image/jpeg'),
          kind: rec.kind || state.wall.kind || 'image',
        };
      }
    }

    /* 按钮皮肤图片 */
    if(state.btn.skin && state.btn.skin.on){
      const rec = await WALL.get('btnskin');
      if(rec && rec.blob){
        assets.btnSkin = { b64: await this.blobToB64(rec.blob), type: rec.blob.type || 'image/png' };
      }
    }

    return {
      app: 'wish-simulator',
      ver: DATA_VER,
      at:  new Date().toISOString(),
      ua:  navigator.userAgent,
      size: JSON.stringify(d).length,
      hasAssets: Object.keys(assets).length > 0,
      data: d,
      assets,
    };
  },

  /* ---------- 导出：打包 + 触发下载 ---------- */
  async exportAll(){
    let pack;
    try{ pack = await this.pack(); }
    catch(e){ toast('导出失败：' + ((e && e.message) || '未知错误')); return; }

    const txt  = JSON.stringify(pack);
    const blob = new Blob([txt], { type: 'application/json;charset=utf-8' });

    /* 文件名带上时间，方便区分多次备份 */
    const t = new Date();
    const p2 = n => String(n).padStart(2,'0');
    const stamp = `${t.getFullYear()}${p2(t.getMonth()+1)}${p2(t.getDate())}-${p2(t.getHours())}${p2(t.getMinutes())}${p2(t.getSeconds())}`;
    const name = `祈愿备份-${stamp}${DATA_EXT}`;

    try{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} }, 4000);
    }catch(e){ toast('下载被浏览器拦截，请改用「复制到剪贴板」'); return; }

    const kb = (blob.size/1024).toFixed(1);
    toast(pack.hasAssets ? `已导出 ${kb} KB（含壁纸 / 皮肤图片）` : `已导出 ${kb} KB`);
  },

  /* ---------- 复制到剪贴板（下载被拦时的后路） ---------- */
  async copyAll(){
    let pack;
    try{ pack = await this.pack(); }
    catch(e){ toast('打包失败：' + ((e && e.message) || '未知错误')); return; }
    const txt = JSON.stringify(pack, null, 2);
    const text = txt.length > 8*1024*1024 ? JSON.stringify(pack) : txt;  /* 太大就不美化了 */
    try{
      await navigator.clipboard.writeText(text);
      toast('备份内容已复制到剪贴板（' + (text.length/1024).toFixed(1) + ' KB）');
    }catch(e){
      /* 剪贴板 API 也可能被拒，退到选中文本让用户自己 Ctrl+C */
      const ta = document.getElementById('dpPaste');
      if(ta){ ta.value = text; ta.select(); document.execCommand && document.execCommand('copy'); toast('已填入下方文本框并尝试复制，请按 Ctrl+C 手动复制'); }
      else toast('复制失败，请改用「粘贴文本导入」区域');
    }
  },

  /* ---------- 校验：确认是一个合法的祈愿备份 ---------- */
  validate(obj){
    if(!obj || typeof obj !== 'object') return { ok:false, msg:'内容不是有效的备份数据' };
    if(obj.app !== 'wish-simulator'){
      if(!obj.data || typeof obj.data !== 'object') return { ok:false, msg:'这不是「祈愿」的备份文件' };
    }
    const d = obj.data || (obj.items ? obj : null);
    if(!d || typeof d !== 'object') return { ok:false, msg:'备份里没有找到数据主体' };
    if(Number(obj.ver || 1) > DATA_VER) return { ok:false, msg:'这个备份来自更新的版本，请先更新本应用' };
    return { ok:true, msg:'' };
  },

  /* ---------- 读文件 ---------- */
  pickImport(){
    const inp = document.getElementById('dpFile');
    if(!inp) return;
    inp.value = '';
    inp.click();
  },
  async readFile(file){
    if(!file) return;
    let txt = '';
    try{ txt = await file.text(); }
    catch(e){ toast('读取文件失败'); return; }
    this.accept(txt);
  },
  async readPaste(){
    const ta = document.getElementById('dpPaste');
    const txt = (ta && ta.value || '').trim();
    if(!txt){ toast('请先把备份内容粘贴到文本框里'); return; }
    this.accept(txt);
  },

  /* ---------- 解析 + 交给用户选覆盖/合并 ---------- */
  accept(txt){
    let obj = null;
    try{ obj = JSON.parse(txt); }
    catch(e){ toast('这段内容不是有效的备份数据（JSON 解析失败）'); return; }
    const v = this.validate(obj);
    if(!v.ok){ toast(v.msg); return; }
    this.pending = obj;
    /* 确认卡片长在「数据」页签里。若当前没打开该页签（比如从别处粘贴导入），
       先把面板切过去，否则无处可渲染。 */
    if(!document.getElementById('dpConfirm')){
      mTab = 'data';
      openManager('data');
    }
    this.renderConfirm(obj);
    const card = document.getElementById('dpConfirm');
    if(card){
      card.style.display = 'block';
      setTimeout(()=>{ try{ card.scrollIntoView({ block:'center', behavior:'smooth' }); }catch(e){} }, 80);
    }
  },
  pending: null,

  /* ---------- 导入前的确认卡片 ---------- */
  renderConfirm(obj){
    const d = obj.data || obj;
    const n = Array.isArray(d.items) ? d.items.length : 0;
    const hist = Array.isArray(d.history) ? d.history.length : 0;
    const owned = d.owned && typeof d.owned === 'object' ? Object.keys(d.owned).length : 0;
    const st = d.stats || {};
    const aset = obj.assets || {};
    const when = obj.at ? new Date(obj.at).toLocaleString('zh-CN') : '（未记录）';

    const assetLine = [
      aset.wall    ? '背景壁纸' : '',
      aset.btnSkin ? '按钮皮肤' : '',
    ].filter(Boolean).join(' + ') || '（不含图片）';

    const card = document.getElementById('dpConfirm');
    if(!card) return;
    card.style.display = 'block';
    card.innerHTML = `
      <div class="tline" style="margin-top:0">待导入的备份</div>
      <div class="dpsum">
        <div><span>导出时间</span><b>${esc(when)}</b></div>
        <div><span>卡池对象</span><b>${n} 个</b></div>
        <div><span>抽卡记录</span><b>${hist} 条</b></div>
        <div><span>已有藏品</span><b>${owned} 种</b></div>
        <div><span>累计抽数</span><b>${st.total||0} 抽</b></div>
        <div><span>附带图片</span><b>${esc(assetLine)}</b></div>
      </div>
      <div class="hint" style="margin-top:10px">
        <b>覆盖</b>：清空当前全部数据，完全变成本次导入的内容。<br>
        <b>合并</b>：保留当前对象，只把备份里<b>没见过</b>的对象追加进来；卡池文案、概率、保底、记录、统计仍以备份为准。
      </div>
      <div class="field" style="margin-top:12px">
        <button class="mini danger" id="dpDoReplace">覆盖导入</button>

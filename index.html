        <button class="mini" id="dpDoMerge">合并导入</button>
        <button class="mini ghost" id="dpCancel">取消</button>
      </div>`;

    const g = id => document.getElementById(id);
    if(g('dpDoReplace')) g('dpDoReplace').onclick = ()=>this.apply(obj, 'replace');
    if(g('dpDoMerge'))   g('dpDoMerge').onclick   = ()=>this.apply(obj, 'merge');
    if(g('dpCancel'))    g('dpCancel').onclick    = ()=>{ this.pending = null; card.style.display='none'; };
  },

  /* ---------- 真正落地 ---------- */
  async apply(obj, mode){
    const d = Object.assign({}, obj.data || obj);
    const assets = obj.assets || {};

    /* —— 对象：合并模式下按「同名 + 同稀有度」去重，其余追加 —— */
    const incoming = Array.isArray(d.items) ? d.items : [];
    let added = 0;
    if(mode === 'merge'){
      const seen = new Set(state.items.map(i=>`${i.rarity}|${String(i.name||'').trim()}`));
      incoming.forEach(it=>{
        if(!it || typeof it !== 'object') return;
        const key = `${Number(it.rarity)||3}|${String(it.name||'').trim()}`;
        if(seen.has(key)) return;
        seen.add(key);
        state.items.push({
          id: uid(),
          name: String(it.name||'未命名').slice(0,40),
          rarity: [3,4,5].includes(Number(it.rarity)) ? Number(it.rarity) : 3,
          tag: String(it.tag||'').slice(0,20),
          up: !!it.up,
          weight: isFinite(Number(it.weight)) ? Math.max(0, Number(it.weight)) : 1,
        });
        added++;
      });
    } else {
      state.items = incoming.map(it=>({
        id: uid(),
        name: String((it&&it.name)||'未命名').slice(0,40),
        rarity: [3,4,5].includes(Number(it&&it.rarity)) ? Number(it.rarity) : 3,
        tag: String((it&&it.tag)||'').slice(0,20),
        up: !!(it&&it.up),
        weight: isFinite(Number(it&&it.weight)) ? Math.max(0, Number(it&&it.weight)) : 1,
      }));
    }

    /* —— 其余字段：卡池文案、概率、保底、记录、统计一律以备份为准 —— */
    if(d.meta)    state.meta    = Object.assign({char:{name:'',sub:''},std:{name:'',sub:''}}, d.meta);
    if(d.rates)   state.rates   = Object.assign({}, RATES_DEFAULT, d.rates);
    if(d.owned)   state.owned   = (typeof d.owned === 'object' && d.owned) || {};
    if(d.history) state.history = Array.isArray(d.history) ? d.history : [];
    if(d.stats)   state.stats   = Object.assign({total:0,r5:0,r4:0,r3:0,sc:0,sd:0}, d.stats);
    if(d.audio)   state.audio   = Object.assign({on:true,vol:78}, d.audio);
    if(d.btn)     state.btn     = Object.assign({scale:1}, d.btn);
    if(d.pity && typeof d.pity === 'object'){
      BANNERS.forEach(b=>{ if(d.pity[b.id]) state.pity[b.id] = Object.assign({c5:0,c4:0,guar5:false,guar4:false}, d.pity[b.id]); });
    }
    if(typeof d.banner === 'string' && BANNERS.some(b=>b.id===d.banner)) state.banner = d.banner;

    /* —— 壁纸图片 —— */
    if(assets.wall && assets.wall.b64){
      const blob = this.b64ToBlob(assets.wall.b64, assets.wall.type);
      if(blob){
        const kind = assets.wall.kind === 'video' ? 'video' : 'image';
        state.wall = Object.assign({}, WALL_DEFAULT, d.wall || {}, { src:'custom', kind });
        await WALL.put('current', { blob, kind, name: state.wall.name || '', t: Date.now() });
      }
    } else if(mode === 'replace' && d.wall && d.wall.src !== 'custom'){
      /* 覆盖模式下备份明确是默认背景 → 把现有的自定义背景也清掉 */
      await WALL.del('current');
      state.wall = Object.assign({}, WALL_DEFAULT, d.wall || {});
    }

    /* —— 按钮皮肤图片 —— */
    if(assets.btnSkin && assets.btnSkin.b64){
      const blob = this.b64ToBlob(assets.btnSkin.b64, assets.btnSkin.type);
      if(blob){ await WALL.put('btnskin', { blob, name: (state.btn.skin||{}).name || '自定义皮肤', t: Date.now() }); }
    } else if(mode === 'replace' && (!state.btn.skin || !state.btn.skin.on)){
      await WALL.del('btnskin');
    }

    /* —— 收尾：走一遍 load() 的补全逻辑，避免半残字段 —— */
    this.pending = null;
    const card = document.getElementById('dpConfirm');
    if(card){ card.style.display = 'none'; }

    save();
    load();                       /* 用既有校验/夹取逻辑把字段补全洗净 */
    save();

    await WALL.boot();
    await BSKIN.boot();
    applyBtnScale();
    renderBanner();

    const n = state.items.length;
    toast(mode === 'merge'
      ? `合并完成：新增 ${added} 个对象，当前共 ${n} 个`
      : `覆盖完成：当前共 ${n} 个对象`);

    paintManager();
  },

  /* ---------- 重置为初始状态 ---------- */
  async wipe(){
    state.items = [];
    state.owned = {};
    state.history = [];
    state.stats = {total:0, r5:0, r4:0, r3:0, sc:0, sd:0};
    state.meta = {char:{name:'「星轨之约」',sub:'活动祈愿。被标记为 UP 的对象将获得概率提升。'},
                  std:{name:'「万象常驻」',sub:'常驻祈愿。卡池内全部对象均可能获得。'}};
    state.rates = Object.assign({}, RATES_DEFAULT);
    state.banner = 'char';
    state.wall  = Object.assign({}, WALL_DEFAULT);
    state.audio = {on:true, vol:78};
    state.btn   = { scale:1, skin:{ on:false, fit:'cover', ratio:false, dim:14, radius:0, text:false, chibi:false, name:'', sv:2 } };
    BANNERS.forEach(b=>{ state.pity[b.id] = {c5:0, c4:0, guar5:false, guar4:false}; });

    await WALL.del('current');
    await WALL.del('btnskin');

    save();
    await WALL.boot();
    await BSKIN.boot();
    applyBtnScale();
    renderBanner();
    toast('已重置为初始状态');
    paintManager();
  },
};

/* =========================================================
   6. 抽卡演出（对齐祈愿动画：蓄势 → 白光 → 云涡 → 流星 → 光柱 → 揭示）
   ========================================================= */
const FX = {
  layer:null, canvas:null, ctx:null, W:0, H:0, dpr:1,
  parts:[], rings:[], clouds:[], sea:[], sparks:[], meteors:[],
  phase:'idle', pt:0, t0:0, rarity:3, shake:0, raf:0, resolve:null, done:false, jumping:false,
  cloudSprite:null, skySprite:null, starSprite:null,
  skyMix:0, burstX:0, burstY:0, burstPlaced:false,
  cues:[], cueIdx:0, total:0,

  /* 各阶段时长（秒）——对齐参考视频的音画时间轴 */
  /* 各段时长（秒）——按参考视频逐帧测得的节拍对齐：
     蓄势 0.8 / 白光 0.6 / 云涡 0.6 / 流星 3.2 / 爆发 1.7 / 云海光柱 1.1，合计 8.0s */
  PH: { charge:0.80, wash:0.60, vortex:0.60, meteor:3.20, burst:1.70, pillar:1.10, reveal:0.70 },

  init(){
    this.layer  = document.getElementById('fxLayer');
    this.canvas = document.getElementById('fxCanvas');
    this.ctx    = this.canvas.getContext('2d');
    this.cloudSprite = this.makeCloud();
    this.skySprite   = this.makeSky();
    this.starSprite  = this.makeStars();
    this.resize();
    window.addEventListener('resize', ()=>this.resize());
  },
  resize(){
    if(!this.canvas) return;
    this.dpr = Math.min(window.devicePixelRatio||1, 2);
    this.W = window.innerWidth; this.H = window.innerHeight;
    this.canvas.width  = Math.max(1, Math.floor(this.W*this.dpr));
    this.canvas.height = Math.max(1, Math.floor(this.H*this.dpr));
    this.ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
  },

  /* ================= 预渲染素材 ================= */
  makeCloud(){
    const S = 256;
    const cv = document.createElement('canvas'); cv.width = S; cv.height = S;
    const c = cv.getContext('2d');
    c.globalCompositeOperation = 'lighter';
    for(let i=0;i<17;i++){
      const a = Math.random()*6.283, d = Math.pow(Math.random(),0.7)*S*0.20;
      const x = S/2 + Math.cos(a)*d, y = S/2 + Math.sin(a)*d*0.86;
      const r = S*(0.12 + Math.random()*0.17);
      const g = c.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,   'rgba(255,255,255,0.50)');
      g.addColorStop(0.42,'rgba(238,246,255,0.26)');
      g.addColorStop(0.74,'rgba(196,222,255,0.09)');
      g.addColorStop(1,   'rgba(160,196,255,0)');
      c.beginPath(); c.arc(x,y,r,0,7); c.fillStyle = g; c.fill();
    }
    c.globalCompositeOperation = 'destination-in';
    const m = c.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
    m.addColorStop(0,   'rgba(0,0,0,1)');
    m.addColorStop(0.58,'rgba(0,0,0,0.86)');
    m.addColorStop(0.86,'rgba(0,0,0,0.30)');
    m.addColorStop(1,   'rgba(0,0,0,0)');
    c.fillStyle = m; c.fillRect(0,0,S,S);
    return cv;
  },
  makeSky(){
    const W = 1440, H = 900;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const c = cv.getContext('2d');
    const g = c.createLinearGradient(0,0,0,H);
    g.addColorStop(0,    'rgb(13,44,98)');
    g.addColorStop(0.30, 'rgb(30,82,154)');
    g.addColorStop(0.56, 'rgb(78,140,202)');
    g.addColorStop(0.74, 'rgb(162,202,236)');
    g.addColorStop(0.86, 'rgb(216,234,248)');
    g.addColorStop(1,    'rgb(236,245,253)');
    c.fillStyle = g; c.fillRect(0,0,W,H);
    return cv;
  },
  makeStars(){
    const W = 1440, H = 900;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const c = cv.getContext('2d');
    for(let i=0;i<330;i++){
      const x = Math.random()*W;
      const y = Math.pow(Math.random(), 1.45)*H*0.72;
      const r = Math.random()*1.45 + 0.25;
      const a = Math.random()*0.72 + 0.16;
      c.beginPath(); c.arc(x,y,r,0,7);
      c.fillStyle = 'rgba(' + (i%7===0 ? '255,232,190' : '222,238,255') + ',' + a + ')';
      c.fill();
    }
    for(let i=0;i<16;i++){
      const x = Math.random()*W, y = Math.pow(Math.random(),1.3)*H*0.6;
      const r = Math.random()*2.2 + 1.5;
      const g = c.createRadialGradient(x,y,0,x,y,r*5);
      g.addColorStop(0,'rgba(255,255,255,.85)');
      g.addColorStop(.3,'rgba(200,225,255,.35)');
      g.addColorStop(1,'rgba(180,210,255,0)');
      c.beginPath(); c.arc(x,y,r*5,0,7); c.fillStyle = g; c.fill();
    }
    return cv;
  },

  /* ================= 云 ================= */
  genVortexClouds(){
    const m = Math.min(this.W,this.H);
    this.clouds = [];
    for(let i=0;i<158;i++){
      this.clouds.push({
        a0: Math.random()*6.283,
        r0: m * (0.10 + Math.pow(Math.random(),0.55)*1.85),
        sz: m * (0.30 + Math.random()*0.52),
        al: 0.15 + Math.random()*0.24,
        sp: 0.55 + Math.random()*0.85
      });
    }
  },
  genSeaClouds(){
    const m = Math.min(this.W,this.H), W = this.W, H = this.H;
    this.sea = [];
    for(let i=0;i<132;i++){
      const d = Math.pow(Math.random(), 0.65);
      this.sea.push({
        x: (Math.random()*1.5 - 0.25) * W,
        y: H*(0.748 + d*0.27),
        sz: m * (0.13 + d*0.50),
        al: 0.18 + d*0.44,
        sp: 0.006 + Math.random()*0.016,
        ph: Math.random()*6.283
      });
    }
  },
  drawSeaClouds(t, dim){
    if(!this.sea.length) this.genSeaClouds();
    const ctx = this.ctx, W = this.W, H = this.H, k = (dim==null?1:dim);
    if(k <= 0.01) return;
    const hg = ctx.createLinearGradient(0, H*0.60, 0, H*0.80);
    hg.addColorStop(0,  'rgba(255,255,255,0)');
    hg.addColorStop(.66,'rgba(226,240,255,' + (0.24*k) + ')');
    hg.addColorStop(1,  'rgba(255,255,255,' + (0.50*k) + ')');
    ctx.fillStyle = hg; ctx.fillRect(0, H*0.60, W, H*0.22);
    ctx.globalCompositeOperation = 'lighter';
    for(const c of this.sea){
      const yy = c.y + Math.sin(t*c.sp + c.ph)*4;
      ctx.globalAlpha = Math.min(1, c.al*k);
      ctx.drawImage(this.cloudSprite, c.x - c.sz/2, yy - c.sz/2, c.sz, c.sz);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  },

  /* ================= 天空 ================= */
  drawSky(mix, extraDark){
    const ctx = this.ctx, W = this.W, H = this.H;
    ctx.drawImage(this.skySprite, 0, 0, W, H);
    const d = 0.85*(1 - Math.max(0, Math.min(1, mix))) + (extraDark||0);
    if(d > 0.002){
      ctx.fillStyle = 'rgba(3,8,20,' + Math.min(0.94, d) + ')';
      ctx.fillRect(0,0,W,H);
    }
    const sa = Math.max(0, 1 - mix*0.93);
    if(sa > 0.012){
      ctx.save();
      ctx.globalAlpha = sa;
      ctx.drawImage(this.starSprite, -W*0.14, -H*0.10, W*1.28, H*1.15);
      ctx.restore();
    }
  },

  /* ================= 四芒星 ================= */
  star4(x, y, r, a, rot){
    if(r <= 0 || a <= 0.006) return;
    const c = this.ctx;
    c.save();
    c.translate(x,y); c.rotate(rot||0);
    c.globalCompositeOperation = 'lighter';
    const g = c.createRadialGradient(0,0,0,0,0,r*2.2);
    g.addColorStop(0,  'rgba(255,255,255,' + Math.min(1,a) + ')');
    g.addColorStop(.24,'rgba(214,236,255,' + (a*0.5) + ')');
    g.addColorStop(1,  'rgba(160,200,255,0)');
    c.beginPath(); c.arc(0,0,r*2.2,0,7); c.fillStyle = g; c.fill();
    /* 细长四芒（八点直边星形，比曲线更锐利） */
    const L = r*7.0, w = r*0.20;
    c.beginPath();
    c.moveTo(0, -L);
    c.lineTo( w, -L*0.13); c.lineTo( L, 0);  c.lineTo( w,  L*0.13);
    c.lineTo( 0,  L);
    c.lineTo(-w,  L*0.13); c.lineTo(-L, 0);  c.lineTo(-w, -L*0.13);
    c.closePath();
    c.fillStyle = 'rgba(255,255,255,' + Math.min(1, a*1.25) + ')';
    c.fill();
    /* 水平镜头光晕 */
    const lg = c.createLinearGradient(-L*1.6,0,L*1.6,0);
    lg.addColorStop(0,  'rgba(190,220,255,0)');
    lg.addColorStop(.40,'rgba(226,242,255,' + (a*0.30) + ')');
    lg.addColorStop(.5, 'rgba(255,255,255,' + Math.min(1,a*0.88) + ')');
    lg.addColorStop(.60,'rgba(226,242,255,' + (a*0.30) + ')');
    lg.addColorStop(1,  'rgba(190,220,255,0)');
    c.fillStyle = lg;
    const hh = Math.max(1.3, r*0.20);
    c.fillRect(-L*1.6, -hh/2, L*3.2, hh);
    c.restore();
    c.globalCompositeOperation = 'source-over';
  },

  /* ================= 流星 ================= */
  spawnMeteor(main, bornAt){
    const W = this.W, H = this.H, m = Math.min(W,H);
    const mk = o => { o.bornAt = bornAt || 0; o.px = null; o.py = null; o.dead = false; return o; };
    if(main){
      /* 主流星：从左上划向右下，与参考视频一致 */
      this.meteors.push(mk({ x:-W*0.10, y:-H*0.26, dx:0.78, dy:0.63, sp:m*0.74,
        life:this.PH.meteor*0.96, len:m*1.12, w:1, main:true }));
    } else {
      const n = 1 + (Math.random() < 0.5 ? 1 : 0);
      for(let i=0;i<n;i++){
        const left = Math.random() < 0.72;
        this.meteors.push(mk({
          x: left ? -W*(0.06 + Math.random()*0.26) : W*(0.62 + Math.random()*0.45),
          y: -H*(0.10 + Math.random()*0.40),
          dx: left ? 0.78 : -0.78, dy: 0.63,
          sp: m*(0.62 + Math.random()*0.78),
          life: 0.80 + Math.random()*0.60, len: m*(0.42 + Math.random()*0.52),
          w: 0.38 + Math.random()*0.44, main:false }));
      }
    }
  },
  /* phaseEl：进入流星阶段后经过的秒数（与帧率无关，位置完全由时间轴决定） */
  meteorStep(phaseEl){
    const W = this.W, H = this.H;
    for(const mt of this.meteors){
      if(mt.dead) continue;
      const t = phaseEl - mt.bornAt;
      if(t < 0) continue;
      mt.t = Math.min(t, mt.life);
      const d = Math.hypot(mt.dx, mt.dy) || 1;
      const npx = mt.x + (mt.dx/d)*mt.sp*mt.t;
      const npy = mt.y + (mt.dy/d)*mt.sp*mt.t;
      const moved = (mt.px == null) ? 0 : Math.hypot(npx - mt.px, npy - mt.py);
      mt.px = npx; mt.py = npy;
      if(!mt.main && t >= mt.life){ mt.dead = true; continue; }
      if(npy > H*0.84 || npx < -W*0.35){ mt.dead = true; continue; }
      /* 星点按“行进距离”生成，掉帧也不会变稀 */
      let k = moved/24;
      while(k > 0){
        if(k < 1 && Math.random() > k) break;
        const f = Math.random();
        this.sparks.push({
          x: npx - (mt.dx/d)*mt.len*f + (Math.random()-0.5)*mt.len*0.16,
          y: npy - (mt.dy/d)*mt.len*f + (Math.random()-0.5)*mt.len*0.14,
          r: (mt.main ? 2.0 : 1.3) + Math.random()*2.0,
          life: 1, dec: 0.22 + Math.random()*0.40,
          rot: Math.random()*6.283, vr: (Math.random()-0.5)*0.03,
          vx: (Math.random()-0.5)*10, vy: -6 - Math.random()*12
        });
        k -= 1;
      }
    }
    this.meteors = this.meteors.filter(mt => !mt.dead || mt.main);
  },
  drawMeteors(){
    const c = this.ctx;
    for(const mt of this.meteors){
      if(mt.px === undefined || mt.dead) continue;
      const x = mt.px, y = mt.py;
      const d = Math.hypot(mt.dx, mt.dy) || 1;
      const ang = Math.atan2(mt.dy/d, mt.dx/d);
      const fade = mt.main ? 1 : Math.max(0, 1 - mt.t/(mt.life*1.15));
      if(fade <= 0.02) continue;
      const L = mt.len*(mt.main ? 1 : 0.78);
      c.save();
      c.translate(x,y); c.rotate(ang);
      c.globalCompositeOperation = 'lighter';
      const g1 = c.createLinearGradient(-L,0,0,0);
      g1.addColorStop(0,   'rgba(90,160,240,0)');
      g1.addColorStop(.38, 'rgba(118,182,250,' + (0.16*fade) + ')');
      g1.addColorStop(.78, 'rgba(180,222,255,' + (0.50*fade) + ')');
      g1.addColorStop(1,   'rgba(255,255,255,' + (0.92*fade) + ')');
      c.beginPath();
      c.moveTo(0,-7*mt.w); c.lineTo(0,7*mt.w);
      c.lineTo(-L, 46*mt.w); c.lineTo(-L,-46*mt.w);
      c.closePath(); c.fillStyle = g1; c.fill();
      const g2 = c.createLinearGradient(-L*0.96,0,0,0);
      g2.addColorStop(0,   'rgba(180,215,255,0)');
      g2.addColorStop(.62, 'rgba(224,240,255,' + (0.50*fade) + ')');
      g2.addColorStop(1,   'rgba(255,255,255,' + (1.0*fade) + ')');
      c.beginPath();
      c.moveTo(0,-2.6*mt.w); c.lineTo(0,2.6*mt.w);
      c.lineTo(-L*0.96, 6.4*mt.w); c.lineTo(-L*0.96,-6.4*mt.w);
      c.closePath(); c.fillStyle = g2; c.fill();
      c.restore();
      c.globalCompositeOperation = 'source-over';
      const r = (mt.main ? 7.4 : 4.0)*fade;
      const gg = c.createRadialGradient(x,y,0,x,y,r*7);
      gg.addColorStop(0,  'rgba(255,255,255,' + (0.95*fade) + ')');
      gg.addColorStop(.22,'rgba(226,242,255,' + (0.60*fade) + ')');
      gg.addColorStop(.55,'rgba(150,200,255,' + (0.22*fade) + ')');
      gg.addColorStop(1,  'rgba(120,175,255,0)');
      c.save(); c.globalCompositeOperation = 'lighter';
      c.beginPath(); c.arc(x,y,r*7,0,7); c.fillStyle = gg; c.fill();
      c.restore();
      this.star4(x, y, r*(mt.main ? 1.5 : 1), fade, ang);
    }
  },

  /* ================= 音效提示点 ================= */
  buildCues(){
    const T = this.PH, C = [];
    let t = 0;
    C.push({t:0, f:()=>{ SFX.charge(T.charge); SFX.padOn(); }});
    t += T.charge;
    C.push({t:t-0.12, f:()=>SFX.wash(T.wash)});
    t += T.wash;
    C.push({t:t, f:()=>SFX.vortex(T.vortex)});
    t += T.vortex;
    const mS = t;
    this.meteorStart = mS;
    const born = at => at - mS;
    C.push({t:mS, f:()=>this.spawnMeteor(true, 0)});
    /* 副流星按段长均布，保证整段流星雨不断流（不随段长变化而变稀） */
    const nSec = Math.max(4, Math.round(T.meteor / 0.45));
    for(let i=0;i<nSec;i++){
      const at = mS + 0.14 + i * ((T.meteor - 0.45) / nSec);
      C.push({t:at, f:()=>this.spawnMeteor(false, born(at))});
    }
    let k = 0;
    const wStep = Math.max(0.16, T.meteor / 9);
    for(let tt = mS; tt < mS + T.meteor - 0.12; tt += wStep){
      const idx = k++;
      C.push({t:tt, f:()=>SFX.meteor(idx)});
    }
    for(let i=0;i<12;i++){
      const tt = mS + 0.18 + i * ((T.meteor - 0.3) / 12) + Math.random()*0.06;
      C.push({t:tt, f:()=>SFX.sparkle(1650 + Math.random()*2500, 0.05, 1.7)});
    }
    t += T.meteor;
    C.push({t:t, f:()=>{ SFX.burst(this.rarity >= 5); SFX.padOff(0.9); }});
    t += T.burst;
    C.push({t:t, f:()=>SFX.pillar(T.pillar)});
    for(let i=0;i<5;i++){
      const ii = i;
      C.push({t:t + 0.16 + ii*0.18, f:()=>SFX.sparkle(1180 + ii*280, 0.062, 1.9)});
    }
    t += T.pillar;
    C.push({t:t + 0.04, f:()=>SFX.reveal(this.rarity)});
    this.cues = C.sort((a,b)=>a.t-b.t);
    this.cueIdx = 0;
    this.total = t + T.reveal;
  },

  /* ================= 主入口 ================= */
  play(rarity){
    this.rarity = rarity;
    this.done = false; this.jumping = false;
    this.parts = []; this.rings = []; this.sparks = []; this.meteors = [];
    this.clouds = []; this.sea = [];
    this.skyMix = 0; this.shake = 0; this.burstPlaced = false;
    this.resize();
    this.burstX = this.W/2; this.burstY = this.H*0.60;
    this.buildCues();
    this.t0 = performance.now();
    this.lastTs = this.t0;
    this.layer.classList.add('on');
    const hm = document.getElementById('hitMsg');
    if(hm){ hm.className = 'hitmsg'; hm.textContent = ''; }
    cancelAnimationFrame(this.raf);
    this.loop();
    return new Promise(res=>{ this.resolve = res; });
  },
  resolveNow(){
    if(this.done) return;
    this.done = true;
    cancelAnimationFrame(this.raf);
    this.phase = 'idle';
    SFX.padOff(0.5);
    if(this.resolve){
      const r = this.resolve; this.resolve = null;
      this.layer.classList.remove('on');
      r();
    }
  },
  /* 跳过：快进到揭示段 */
  skip(){
    if(this.done || this.phase === 'idle' || this.jumping) return;
    this.jumping = true;
    this.t0 = performance.now() - (this.total - this.PH.reveal)*1000;
    this.cueIdx = this.cues.length;
    this.skyMix = 1; this.meteors = [];
    SFX.padOff(0.3);
    SFX.reveal(this.rarity);
  },
  finish(){ this.skip(); },
  get busy(){ return this.phase !== 'idle' && !this.done; },

  /* ================= 每帧 ================= */
  loop(){
    if(this.done) return;
    const nowMs = performance.now();
    const el = (nowMs - this.t0)/1000;
    const ctx = this.ctx, W = this.W, H = this.H, T = this.PH;
    const order = ['charge','wash','vortex','meteor','burst','pillar','reveal'];
    let acc = 0, ph = 'reveal', pt = 1, phStart = acc;
    for(const k of order){
      if(el < acc + T[k]){ ph = k; pt = (el - acc)/T[k]; phStart = acc; break; }
      acc += T[k]; phStart = acc;
    }
    this.phase = ph; this.pt = Math.max(0, Math.min(1, pt));

    while(this.cueIdx < this.cues.length && this.cues[this.cueIdx].t <= el){
      const cue = this.cues[this.cueIdx++];
      try{ cue.f(); }catch(e){}
    }

    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    ctx.save();
    if(this.shake > 0.25){
      ctx.translate((Math.random()-0.5)*this.shake, (Math.random()-0.5)*this.shake);
      this.shake *= 0.90;
    }
    ctx.clearRect(-60,-60,W+120,H+120);
    const cx = W/2, cy = H*0.44;

    /* ① 蓄势 */
    if(ph === 'charge'){
      const p = this.pt;
      ctx.fillStyle = 'rgba(5,9,20,' + (0.86*p*p) + ')';
      ctx.fillRect(-60,-60,W+120,H+120);
      const r = 40 + p*p*Math.max(W,H)*0.62;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0,  'rgba(255,255,255,' + (0.10 + p*0.46) + ')');
      g.addColorStop(.45,'rgba(226,236,255,' + (0.05 + p*0.24) + ')');
      g.addColorStop(1,  'rgba(170,195,255,0)');
      ctx.fillStyle = g; ctx.fillRect(-60,-60,W+120,H+120);
      for(let i=0;i<3;i++){
        const rr = Math.max(20, r*(1 - i*0.28));
        ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 7);
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.05 + p*0.10) + ')';
        ctx.lineWidth = 1.4 + i; ctx.stroke();
      }
    }

    /* ② 白光冲刷 */
    if(ph === 'wash'){
      const p = this.pt;
      const e = Math.pow(Math.min(1, p/0.72), 0.72);
      /* 底：迅速转为不透明，避免页面内容透出来 */
      const baseA = Math.min(1, 0.86 + p*5);
      ctx.fillStyle = 'rgba(6,10,22,' + baseA + ')';
      ctx.fillRect(-60,-60,W+120,H+120);
      const r = Math.max(W,H)*(0.10 + e*1.15);
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      g.addColorStop(0,  'rgba(255,255,255,' + (0.62 + e*0.38) + ')');
      g.addColorStop(.40,'rgba(248,246,255,' + (0.42 + e*0.52) + ')');
      g.addColorStop(.76,'rgba(226,234,255,' + (0.14 + e*0.50) + ')');
      g.addColorStop(1,  'rgba(196,214,255,0)');
      ctx.fillStyle = g; ctx.fillRect(-60,-60,W+120,H+120);
      for(let i=0;i<4;i++){
        const rr = r*(1 - i*0.17);
        if(rr <= 2) continue;
        ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 7);
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.14*(1-p) + 0.05) + ')';
        ctx.lineWidth = 2.4 + i*1.8; ctx.stroke();
      }
      const veil = Math.max(0, (p - 0.44)/0.56);
      if(veil > 0){ ctx.fillStyle = 'rgba(252,251,255,' + veil + ')'; ctx.fillRect(-60,-60,W+120,H+120); }
    }

    /* ③ 云涡开启 */
    if(ph === 'vortex'){
      const p = this.pt;
      if(!this.clouds.length) this.genVortexClouds();
      const m = Math.min(W,H);
      this.drawSky(0.04 + p*0.05);
      const wb = Math.max(0, 1 - p/0.55);
      if(wb > 0.002){
        ctx.fillStyle = 'rgba(255,255,255,' + wb + ')';
        ctx.fillRect(-60,-60,W+120,H+120);
      }
      const coreA = Math.max(0, 1 - p/0.55);
      if(coreA > 0.01){
        const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, m*0.42);
        cg.addColorStop(0,  'rgba(255,255,255,' + (0.95*coreA) + ')');
        cg.addColorStop(.35,'rgba(240,246,255,' + (0.55*coreA) + ')');
        cg.addColorStop(1,  'rgba(200,222,255,0)');
        ctx.fillStyle = cg; ctx.fillRect(-60,-60,W+120,H+120);
      }
      const hole = m*(0.015 + p*0.46);
      ctx.globalCompositeOperation = 'lighter';
      for(const c of this.clouds){
        const R = c.r0*(0.56 + p*1.02);
        const ang = c.a0 + p*c.sp*(1.6 + 2.8*Math.exp(-R/(0.34*m)));
        const x = cx + Math.cos(ang)*R;
        const y = cy + Math.sin(ang)*R*0.80;
        const sz = c.sz*(1 + p*0.40);
        const dist = Math.hypot(x-cx, (y-cy)/0.80);
        let al = c.al * Math.min(1, Math.max(0, (dist - hole*0.80)/(hole*0.95 + 1)));
        al *= (1 - p*0.30);
        if(al <= 0.008) continue;
        ctx.globalAlpha = al;
        ctx.drawImage(this.cloudSprite, x-sz/2, y-sz/2, sz, sz);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    /* ④ 星空流星 */
    if(ph === 'meteor'){
      const p = this.pt;
      this.skyMix = Math.min(1, 0.42 + p*0.58);
      this.drawSky(this.skyMix);
      this.drawSeaClouds(el, Math.min(1, p*3.2));
      this.meteorStep(el - phStart);
      this.drawMeteors();
      if(p < 0.28 && this.clouds.length){
        const q = 1 - p/0.28;
        ctx.globalCompositeOperation = 'lighter';
        for(let i=0;i<70;i++){
          const c = this.clouds[i]; if(!c) break;
          const R = c.r0*1.58;
          const ang = c.a0 + c.sp*2.6;
          const x = cx + Math.cos(ang)*R, y = cy + Math.sin(ang)*R*0.80;
          const sz = c.sz*1.4;
          ctx.globalAlpha = c.al*0.45*q;
          ctx.drawImage(this.cloudSprite, x-sz/2, y-sz/2, sz, sz);
        }
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      }
    }

    /* ⑤ 光柱爆发 */
    if(ph === 'burst'){
      const p = this.pt;
      if(!this.burstPlaced){
        const mm = this.meteors.find(x=>x.main && x.px !== undefined);
        this.burstX = mm ? mm.px : W*0.42;
        this.burstY = mm ? mm.py : H*0.60;
        this.burstPlaced = true;
        this.shake = 22;
        this.rings.push({r:8, a:1, w:12, max:Math.max(W,H)*0.62});
        this.rings.push({r:2, a:.85, w:5, max:Math.max(W,H)*0.40});
        this.spawn(cx, cy, this.rarity === 5 ? 150 : 110, 13);
      }
      const flare = p < 0.22 ? p/0.22 : Math.max(0, 1 - (p-0.22)/0.78);
      this.drawSky(1, 0.30*(1 - flare*0.5));
      this.drawSeaClouds(el, 0.75);
      const bx = this.burstX, by = this.burstY;
      const n = this.rarity === 5 ? 30 : this.rarity === 4 ? 24 : 16;
      ctx.globalCompositeOperation = 'lighter';
      for(let i=0;i<n;i++){
        const a = (i/n)*6.283 + 0.2 + p*0.5;
        const L = Math.min(W,H)*(0.16 + Math.min(p,0.7)*1.35);
        const wd = (i%2 ? 0.010 : 0.028)*L;
        const g = ctx.createLinearGradient(bx, by, bx+Math.cos(a)*L, by+Math.sin(a)*L);
        g.addColorStop(0,  'rgba(255,255,255,' + (0.95*flare) + ')');
        g.addColorStop(.34,'rgba(214,238,255,' + (0.46*flare) + ')');
        g.addColorStop(1,  'rgba(176,213,255,0)');
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx+Math.cos(a+0.42)*wd, by+Math.sin(a+0.42)*wd);
        ctx.lineTo(bx+Math.cos(a)*L,      by+Math.sin(a)*L);
        ctx.lineTo(bx+Math.cos(a-0.42)*wd, by+Math.sin(a-0.42)*wd);
        ctx.closePath(); ctx.fillStyle = g; ctx.fill();
      }
      const cr = Math.min(W,H)*(0.05 + p*0.52);
      const cg = ctx.createRadialGradient(bx, by, 0, bx, by, cr);
      cg.addColorStop(0,  'rgba(255,255,255,1)');
      cg.addColorStop(.28,'rgba(238,248,255,' + (0.78*flare) + ')');
      cg.addColorStop(.62,'rgba(180,216,255,' + (0.30*flare) + ')');
      cg.addColorStop(1,  'rgba(140,190,255,0)');
      ctx.beginPath(); ctx.arc(bx, by, cr, 0, 7); ctx.fillStyle = cg; ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      this.rings = this.rings.filter(r=>{
        r.r += (r.max - r.r)*0.10; r.a *= 0.955;
        if(r.a < 0.02) return false;
        ctx.beginPath(); ctx.arc(bx, by, r.r, 0, 7);
        ctx.strokeStyle = 'rgba(236,246,255,' + (r.a*0.8) + ')';
        ctx.lineWidth = r.w*r.a; ctx.stroke();
        return true;
      });
      ctx.fillStyle = 'rgba(255,255,255,' + (flare*0.62) + ')';
      ctx.fillRect(-60,-60,W+120,H+120);
      this.starsKick(bx, by, flare);
    }

    /* ⑥ 云海光柱 */
    if(ph === 'pillar'){
      const p = this.pt;
      const rise = Math.min(1, p/0.42);
      this.drawSky(1);
      this.drawSeaClouds(el, 1);
      const hx = W*0.44, hy = H*0.70;
      ctx.globalCompositeOperation = 'lighter';
      /* 竖直光柱（三层叠加做出柔边，向上延伸到画面外） */
      const colH = H*(0.55 + rise*1.10), colW = W*(0.024 + Math.min(p,0.55)*0.055);
      const layers = [[1.0,0.86,1.0],[1.9,0.24,0.74],[3.5,0.10,0.58]];
      for(const [wMul, aMul, hMul] of layers){
        const ch = colH*hMul;
        const gg = ctx.createLinearGradient(hx, hy+30, hx, hy-ch);
        gg.addColorStop(0,  'rgba(255,255,255,' + (rise*aMul) + ')');
        gg.addColorStop(.42,'rgba(232,245,255,' + (rise*aMul*0.52) + ')');
        gg.addColorStop(1,  'rgba(200,226,255,0)');
        ctx.beginPath();
        ctx.moveTo(hx-colW*wMul*0.42, hy+30); ctx.lineTo(hx+colW*wMul*0.42, hy+30);
        ctx.lineTo(hx+colW*wMul, hy-ch);      ctx.lineTo(hx-colW*wMul, hy-ch);
        ctx.closePath(); ctx.fillStyle = gg; ctx.fill();
      }
      /* 扇形光束（两层叠加以获得柔边） */
      for(let i=0;i<26;i++){
        const a = -Math.PI/2 + (i-12.5)/12.5*0.92;
        const L = H*(0.30 + rise*0.60);
        const gg = ctx.createLinearGradient(hx, hy, hx+Math.cos(a)*L, hy+Math.sin(a)*L);
        gg.addColorStop(0,'rgba(255,255,255,' + (0.17*rise) + ')');
        gg.addColorStop(.45,'rgba(226,242,255,' + (0.09*rise) + ')');
        gg.addColorStop(1,'rgba(200,226,255,0)');
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(hx+Math.cos(a+0.055)*L, hy+Math.sin(a+0.055)*L);
        ctx.lineTo(hx+Math.cos(a-0.055)*L, hy+Math.sin(a-0.055)*L);
        ctx.closePath(); ctx.fillStyle = gg; ctx.fill();
      }
      /* 地平线光晕（纯径向，边界自然消失） */
      const hr = W*0.46;
      const hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, hr);
      hg.addColorStop(0,  'rgba(255,255,255,' + (0.92*rise) + ')');
      hg.addColorStop(.20,'rgba(238,248,255,' + (0.62*rise) + ')');
      hg.addColorStop(.55,'rgba(212,235,255,' + (0.22*rise) + ')');
      hg.addColorStop(1,  'rgba(190,218,255,0)');
      ctx.beginPath(); ctx.arc(hx, hy, hr, 0, 7); ctx.fillStyle = hg; ctx.fill();
      const sweep = Math.max(0, 1 - Math.abs(p-0.5)/0.5);
      const sg = ctx.createLinearGradient(0, hy-H*0.06, 0, hy+H*0.02);
      sg.addColorStop(0,'rgba(255,255,255,0)');
      sg.addColorStop(1,'rgba(255,255,255,' + (0.5*sweep*rise) + ')');
      ctx.fillStyle = sg; ctx.fillRect(0, hy-H*0.06, W, H*0.08);
      ctx.globalCompositeOperation = 'source-over';
      const wv = Math.max(0, (p-0.52)/0.48);
      if(wv > 0){ ctx.fillStyle = 'rgba(255,255,255,' + (wv*0.96) + ')'; ctx.fillRect(-60,-60,W+120,H+120); }
    }

    /* ⑦ 揭示爆闪 */
    if(ph === 'reveal'){
      const p = this.pt;
      const base = Math.max(0, 1 - p/0.34);
      const hy = H*0.48;
      const bg = ctx.createRadialGradient(cx, hy, 0, cx, hy, Math.max(W,H)*0.75);
      bg.addColorStop(0,  'rgb(72,90,156)');
      bg.addColorStop(.45,'rgb(36,46,96)');
      bg.addColorStop(1,  'rgb(8,11,26)');
      ctx.fillStyle = bg; ctx.fillRect(-60,-60,W+120,H+120);
      const k = Math.min(1, p/0.72);
      const rad = Math.min(W,H)*(0.14 + k*0.95);
      const N = 54;
      ctx.globalCompositeOperation = 'lighter';
      for(let i=0;i<N;i++){
        const a = (i/N)*6.283 + (i%3)*0.058;
        const rIn = rad*0.16;
        const L = rad*(0.46 + ((i*37)%13)/13*0.62);
        const hw = rad*(0.032 + ((i*53)%7)/7*0.052);
        const x0 = cx+Math.cos(a)*rIn, y0 = hy+Math.sin(a)*rIn;
        const x1 = cx+Math.cos(a)*L,   y1 = hy+Math.sin(a)*L;
        const mx = (x0+x1)/2, my = (y0+y1)/2;
        const nx = -Math.sin(a), ny = Math.cos(a);
        const g = ctx.createLinearGradient(x0,y0,x1,y1);
        g.addColorStop(0,  'rgba(206,230,255,' + (0.58*k) + ')');
        g.addColorStop(.55,'rgba(152,196,250,' + (0.86*k) + ')');
        g.addColorStop(1,  'rgba(178,160,236,0)');
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.quadraticCurveTo(mx+nx*hw, my+ny*hw, x1, y1);
        ctx.quadraticCurveTo(mx-nx*hw, my-ny*hw, x0, y0);
        ctx.closePath(); ctx.fillStyle = g; ctx.fill();
      }
      const cg = ctx.createRadialGradient(cx, hy, 0, cx, hy, rad*0.6);
      cg.addColorStop(0,'rgba(232,242,255,' + (0.55*(1-k*0.6)) + ')');
      cg.addColorStop(1,'rgba(150,190,250,0)');
      ctx.beginPath(); ctx.arc(cx, hy, rad*0.6, 0, 7); ctx.fillStyle = cg; ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      if(base > 0){ ctx.fillStyle = 'rgba(255,255,255,' + base + ')'; ctx.fillRect(-60,-60,W+120,H+120); }
    }

    /* 通用粒子 */
    this.sparks = this.sparks.filter(s=>{
      s.x += s.vx*0.016; s.y += s.vy*0.016; s.vx *= 0.985; s.vy = s.vy*0.985 + 0.10;
      s.rot += s.vr; s.life -= s.dec*0.016;
      if(s.life <= 0) return false;
      const a = Math.min(1, s.life)*(0.55 + 0.45*Math.sin(s.rot*2.2));
      this.star4(s.x, s.y, s.r*Math.max(0.25, s.life), a*0.9, s.rot);
      return true;
    });
    this.parts = this.parts.filter(p=>{
      p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.vx *= 0.985; p.vy *= 0.985; p.life -= p.decay;
      if(p.life <= 0) return false;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r*Math.max(p.life,0), 0, 7);
      ctx.fillStyle = 'rgba(226,240,255,' + (p.life*0.8) + ')'; ctx.fill();
      return true;
    });

    ctx.restore();
    if(el >= this.total){ this.resolveNow(); return; }
    this.raf = requestAnimationFrame(()=>this.loop());
  },
  starsKick(bx, by, flare){
    if(flare < 0.8) return;
    const now = performance.now();
    if(now - (this._kick||0) < 90) return;
    this._kick = now;
    for(let i=0;i<3;i++){
      const a = Math.random()*6.283, d = Math.min(this.W,this.H)*(0.10 + Math.random()*0.35);
      this.sparks.push({ x: bx+Math.cos(a)*d, y: by+Math.sin(a)*d, r: 1.4+Math.random()*2.0,
        life: 1, dec: 0.5+Math.random()*0.6, rot: Math.random()*6.283, vr: (Math.random()-0.5)*0.05,
        vx:(Math.random()-0.5)*40, vy:-10-Math.random()*40 });
    }
  },
  spawn(x,y,n,spread){
    for(let i=0;i<n;i++){
      const a = Math.random()*6.283, sp = Math.random()*spread;
      this.parts.push({x,y,vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1,
        decay:0.012+Math.random()*0.020, r:Math.random()*2.6+0.8});
    }
  }
};

/* =========================================================
   6. 翻牌
   ========================================================= */
/* 可爱风：浅色卡面上用「深一档」的同色系做描边与星色，才有对比 */
const ACC = {5:'#e08a1e', 4:'#8f5fd0', 3:'#4a9bd8'};
/* 卡面可用高度：窄屏卡片是 216×338 且 .artw 少 88px，桌面是 256×398 少 96px。
   除以 1.2 是给竖排的 letter-spacing(0.2em) 留量，否则长名字会折到第二列。 */
function monoSize(name){
  const n = Math.max((name||'').length, 1);
  const capH = window.innerWidth <= 880 ? 228 : 258;
  return Math.max(14, Math.min(62, Math.floor(capH / (1.2 * n))));
}

const RV = {
  layer:null, stage:null, grid:null, footer:null, rays:null,
  resolveWait:null, busy:false,

  init(){
    this.layer  = document.getElementById('rvLayer');
    this.stage  = document.getElementById('rvStage');
    this.grid   = document.getElementById('rvGrid');
    this.footer = document.getElementById('rvFooter');
    this.rays   = document.getElementById('rays');
    this.buildDeco();
    document.addEventListener('pointerdown', ()=>{ if(this.resolveWait){ const r=this.resolveWait; this.resolveWait=null; r(); } });
  },

  /* 背景里飘浮的糖豆光点与小星星（一次生成，常驻） */
  buildDeco(){
    const d = document.getElementById('rvDeco');
    if(!d || d.childElementCount) return;
    const pal = ['#ffd166','#ffb3c8','#b7e08a','#a8d8f5','#d9b8f0','#ffe9a8','#9fe6d8'];
    let h = '';
    for(let i=0;i<34;i++){
      const star = Math.random() < 0.38;
      const sz = star ? (8 + Math.random()*13) : (7 + Math.random()*17);
      const x  = (Math.random()*100).toFixed(1);
      const y  = (6 + Math.random()*88).toFixed(1);
      const dur= (8 + Math.random()*6).toFixed(1);
      const dly= (Math.random()*1.6).toFixed(2);
      const c  = pal[i % pal.length];
      h += '<i' + (star ? ' class="st"' : '') + ' style="left:' + x + '%;top:' + y + '%;'
        + 'width:' + sz.toFixed(1) + 'px;height:' + sz.toFixed(1) + 'px;--dc:' + c + ';'
        + '--dur:' + dur + 's;animation-delay:' + dly + 's"></i>';
    }
    d.innerHTML = h;
  },
  wait(ms){
    return new Promise(res=>{
      const t = setTimeout(()=>{ this.resolveWait=null; res(); }, ms);
      this.resolveWait = ()=>{ clearTimeout(t); res(); };
    });
  },
  waitClick(){ return new Promise(res=>{ this.resolveWait = res; }); },

  /* 彩屑：马卡龙多色轮流取（比单一色更「糖果」） */
  shardsHTML(n, r){
    const pal = r===5 ? ['#ffd166','#ffb347','#ffe9a8','#ff9f68']
              : r===4 ? ['#c9a8f0','#b58ce8','#e6d4ff','#f0b7e8']
                      : ['#a8d8f5','#8ecdf2','#d5ecfd','#bfe4fb'];
    let h = '';
    for(let i=0;i<n;i++){
      const a = (i*(360/n) + (Math.random()*13-6.5)).toFixed(1);
      const L = (92 + Math.random()*152).toFixed(0);
      const w = (1.6 + Math.random()*3.4).toFixed(1);
      const d = (Math.random()*0.14).toFixed(2);
      const col = pal[i % pal.length];
      h += '<i style="rotate:' + a + 'deg"><b style="width:' + w + 'px;height:' + L + 'px;'
        + 'background:linear-gradient(180deg,' + col + ',rgba(255,255,255,.78) 52%,rgba(255,255,255,0));'
        + 'animation-delay:' + d + 's"></b></i>';
    }
    return h;
  },
  cardHTML(item, r){
    const acc = ACC[r];
    const ms = monoSize(item.name);
    const ls = Math.round(ms*0.2);
    return `<div class="card r${r}">
      <div class="rays" style="--rg:${acc}"></div>
      <div class="bg"></div>
      <div class="shards">${this.shardsHTML(44, r)}</div>
      <div class="artw"><div class="mono-out" style="font-size:${ms}px;letter-spacing:${ls}px">${esc(item.name)}</div><div class="mono" style="font-size:${ms}px;letter-spacing:${ls}px">${esc(item.name)}</div></div>
      <div class="silh" style="font-size:${ms}px;letter-spacing:${ls}px">${esc(item.name)}</div>
      ${r>=4?`<div class="badge ${item.isNew?'':'dup'}">${item.isNew?'NEW':'已拥有'}</div>`:''}
      <div class="info">
        <div class="nm">${esc(item.name)}</div>
        <div class="st">${'★'.repeat(r)}</div>
        <div class="mt">${esc(item.tag||'—')}</div>
      </div>
    </div>`;
  },
  async showBig(item, r){
    this.stage.innerHTML = this.cardHTML(item, r);
    const card = this.stage.querySelector('.card');
    if(card){ card.classList.remove('burst'); void card.offsetWidth; card.classList.add('burst'); }
    const cr = this.stage.querySelector('.rays');
    if(cr) setTimeout(()=>cr.classList.add('on'), 60);
    if(r===5){ this.rays.style.setProperty('--rg', ACC[5]); this.rays.classList.add('on'); }
    else this.rays.classList.remove('on');
    SFX.chime(r);
    SFX.settle(r);
    if(r===5){
      const f = document.getElementById('rvFlash');
      f.style.transition='none'; f.style.opacity='0.86';
      requestAnimationFrame(()=>{ f.style.transition='opacity .6s'; f.style.opacity='0'; });
    }
  },
  gridHTML(item, r, i){
    return `<div class="gc" style="--rc:${r===5?'#ffe3ae':r===4?'#e0cdfb':'#bfe0f7'};--rg:${ACC[r]};animation-delay:${i*0.045}s">
      <div class="gbg"></div>
      <div class="gmono">${esc((item.name||'?').slice(0,1))}</div>
      ${item.isNew?'<div class="gk">NEW</div>':''}
      <div class="gn">${esc(item.name)}</div>
      <div class="gs">${'★'.repeat(r)}</div>
    </div>`;
  },
  async run(results){
    if(this.busy || !results.length) return;
    this.busy = true;
    this.layer.classList.add('on');
    this.grid.classList.remove('on'); this.grid.innerHTML='';
    this.stage.style.display='grid';
    const b = curBanner();

    if(results.length === 1){
      await this.showBig(results[0], results[0].rarity);
      this.buildFooter(1);
      await this.waitClick();
    } else {
      this.footer.classList.add('hide'); this.footer.innerHTML='';
      for(let i=0;i<results.length;i++){
        await this.showBig(results[i], results[i].rarity);
        if(i<results.length-1) await this.wait(720);
      }
      await this.wait(320);
      this.stage.style.display='none';
      this.rays.classList.remove('on');
      this.grid.innerHTML = results.map((r,i)=>this.gridHTML(r, r.rarity, i)).join('');
      this.grid.classList.add('on');
      this.buildFooter(results.length);
      this.footer.classList.remove('hide');
    }
    this.busy = false;
  },
  buildFooter(){
    this.footer.innerHTML = `
      <button class="wbtn sec" id="rvClose" style="padding:0 34px">确认</button>
      <button class="wbtn sec" id="rvAgain1" style="padding:0 30px">再抽一次</button>`;
    const c=document.getElementById('rvClose'); if(c) c.onclick=e=>{e.stopPropagation(); this.close();};
    const a1=document.getElementById('rvAgain1'); if(a1) a1.onclick=e=>{e.stopPropagation(); this.close(); startPull(1);};
  },
  close(){
    this.layer.classList.remove('on');
    this.rays.classList.remove('on');
    this.stage.innerHTML=''; this.grid.innerHTML=''; this.grid.classList.remove('on');
    if(this.resolveWait){ const r=this.resolveWait; this.resolveWait=null; r(); }
  }
};

/* 抽卡演出。货币体系已整体移除，祈愿不再消耗任何资源 */
async function startPull(n){
  if(FX.busy || RV.busy) return;
  SFX.init(); SFX.resume();
  if(!state.items.length){ toast('还没有任何抽卡对象，请先添加'); openManager('list'); return; }
  if(!state.items.some(i=>wOf(i) > 0)){ toast('所有对象权重均为 0，无法抽取'); openManager('rate'); return; }

  const b = curBanner();
  const results = pullN(b, n);
  save(); renderBanner();

  const best = Math.max(...results.map(r=>r.rarity));
  await FX.play(best);
  await RV.run(results);
  save(); renderBanner();
}

}

let SIMCACHE = null;
function updateSim(){
  const box = document.getElementById('simBox'); if(!box) return;
  const s = simulate(120000);
  SIMCACHE = s;
  const r = R();
  const warn = [];
  if(r.r5soft > r.r5hard) warn.push('五星「开始提升」大于硬保底，该段设置不生效');
  if(r.r5hard < 1) warn.push('五星硬保底需 ≥ 1');
  if(r.r4hard < 1) warn.push('四星硬保底需 ≥ 1');
  box.innerHTML = `
    实测（12 万次模拟）：五星 <b>${(s.p5*100).toFixed(2)}%</b>（平均 <b>${s.avg5.toFixed(1)}</b> 抽）·
    四星 <b>${(s.p4*100).toFixed(2)}%</b>（平均 <b>${s.avg4.toFixed(1)}</b> 抽）·
    三星 <b>${(s.p3*100).toFixed(2)}%</b><br>
    <i>活动祈愿 UP 对象综合命中率 ${(s.upRate*100).toFixed(1)}%（单次 UP 概率 ${r.up}%，未中则下次必中）</i>
    ${warn.length ? `<br><i style="color:#e89a9a">⚠ ${warn.join('；')}</i>` : ''}`;
  updatePcts();
}
function updatePcts(){
  const b = curBanner();
  const tier = {5: SIMCACHE?SIMCACHE.p5:0, 4: SIMCACHE?SIMCACHE.p4:0, 3: SIMCACHE?SIMCACHE.p3:0};
  const q = 1/(2 - Math.min(R().up,100)/100);       // UP 分支长期占比
  [5,4,3].forEach(rar=>{
    const arr = state.items.filter(i=>i.rarity===rar);
    const ups = arr.filter(i=>i.up && wOf(i)>0), offs = arr.filter(i=>!i.up && wOf(i)>0);
    const Wu = wsum(ups), Wo = wsum(offs);
    const split = (rar===5 || rar===4) && b.type==='char' && Wu>0 && Wo>0;
    arr.forEach(i=>{
      let share;
      if(wOf(i) <= 0) share = 0;
      else if(split) share = i.up ? q*wOf(i)/Wu : (1-q)*wOf(i)/Wo;
      else { const tot = wsum(arr); share = tot>0 ? wOf(i)/tot : 0; }
      const el = document.querySelector(`[data-wp="${i.id}"]`);
      if(el) el.innerHTML = wOf(i)<=0
        ? '<span style="color:#e89a9a">0%</span><i>已禁用</i>'
        : (share*100).toFixed(1)+'%<i>综合 '+(share*tier[rar]*100).toFixed(2)+'%</i>';
    });
    const t = document.querySelector(`[data-wtot="${rar}"]`);
    if(t) t.textContent = wsum(arr).toFixed(1);
  });
}
function syncWeight(id, from){
  const it = itemById(id); if(!it) return;
  const v = wOf(it);
  const rg = document.querySelector(`[data-w="${id}"]`);
  const nb = document.querySelector(`[data-wn="${id}"]`);
  if(rg && from !== 'range'){ rg.max = Math.max(10, Math.ceil(v*2)); rg.value = v; }
  if(nb && from !== 'number') nb.value = v;
  updatePcts();
}

Object.assign(WALL, {
  /* 面板里的预览图 */
  mountPanel(){
    const prev = document.getElementById('wprev');
    if(!prev) return;
    const w = state.wall;
    prev.innerHTML = '';
    let node = null;
    if(w.src === 'custom' && w.kind === 'camera' && this.liveStream){
      node = document.createElement('video');
      node.srcObject = this.liveStream; node.muted = true; node.autoplay = true; node.playsInline = true;
    } else if(w.src === 'custom' && this.objUrl){
      node = document.createElement(w.kind === 'video' ? 'video' : 'img');
      node.src = this.objUrl;
      if(node.tagName === 'VIDEO'){ node.muted = true; node.loop = true; node.autoplay = true; node.playsInline = true; }
    }
    if(node){
      node.style.filter    = w.blur ? 'blur(' + w.blur + 'px)' : '';
      node.style.transform = w.blur ? 'scale(1.07)' : '';
      prev.appendChild(node);
      const veil = document.createElement('div');
      veil.style.cssText = 'position:absolute;inset:0;background:rgba(4,8,18,' + ((w.dim||0)/100) + ')';
      prev.appendChild(veil);
      if(node.tagName === 'VIDEO') node.play().catch(()=>{});
    } else {
      const ph = document.createElement('div');
      ph.className = 'ph';
      ph.textContent = '默认背景（深蓝金）';
      prev.appendChild(ph);
    }
  },

  /* 相机面板 */
  async renderCamBox(){
    const box = document.getElementById('camBox');
    if(!box) return;
    box.innerHTML = `
      <div class="tline">相机实时预览</div>
      <div class="camwrap">
        <video id="camPrev" autoplay muted playsinline style="--mir:${this.camFacing==='user'?-1:1}"></video>
        <div class="cmsg" id="camMsg">正在请求相机权限…</div>
      </div>
      <div class="camrow">
        <button class="mini" id="camShot">拍照设为背景</button>
        <button class="mini" id="camLive">用作动态壁纸</button>
        <button class="mini ghost" id="camFlip">切换前后摄像头</button>
        <button class="mini ghost" id="camOff">关闭相机</button>
      </div>
      <div class="hint" style="margin-top:10px">浏览器若不允许调用相机，可改用「从相册选择」，或点上面的「拍照」按钮调起系统相机。</div>`;
    const v = document.getElementById('camPrev');
    const msg = document.getElementById('camMsg');
    const r = await this.camStart(this.camFacing);
    const cmsg = document.getElementById('camMsg');
    if(!r.ok){
      if(cmsg) cmsg.textContent = r.msg;
      if(v) v.style.display = 'none';
    } else {
      if(cmsg) cmsg.remove();
      v.srcObject = this.camStream;
      v.style.setProperty('--mir', this.camFacing === 'user' ? -1 : 1);
      v.play().catch(()=>{});
    }
    const g = id => document.getElementById(id);
    if(g('camShot')) g('camShot').onclick = async ()=>{
      SFX.click();
      const blob = await this.camShot();
      if(!blob){ toast('拍照失败，请稍后重试'); return; }
      await this.commit(blob, 'image', '相机拍摄');
      toast('已使用拍摄的照片作为背景');
    };
    if(g('camLive')) g('camLive').onclick = ()=>this.camToWall();
    if(g('camFlip')) g('camFlip').onclick = async ()=>{
      this.camFacing = this.camFacing === 'user' ? 'environment' : 'user';
      await this.renderCamBox();
    };
    if(g('camOff')) g('camOff').onclick = ()=>{ this.camStop(); box.innerHTML=''; };
  }
});

/* —— 管理面板交互（事件委托，只绑定一次）—— */
function bindManager(){
  const body = document.getElementById('mBody');

  body.addEventListener('click', e=>{
    const t = e.target;

    if(t.id==='qAdd'){
      const name = (document.getElementById('qName').value||'').trim();
      if(!name){ toast('请输入名称'); return; }
      state.items.push({ id:uid(), name,
        rarity:+document.getElementById('qRar').value,
        tag:(document.getElementById('qTag').value||'').trim(),
        up:document.getElementById('qUp').checked, weight:1 });
      save(); paintManager(); renderBanner(); toast('已添加：'+name); return;
    }
    if(t.id==='bulkAdd'){
      const raw = document.getElementById('bulkText').value||'';
      const list = parseBulk(raw);
      if(!list.length){ toast('没有解析到有效内容'); return; }
      if(document.getElementById('bulkClear').checked) state.items = [];
      state.items.push(...list);
      save(); renderBanner(); toast(`已导入 ${list.length} 个对象`);
      mTab='list'; paintManager(); return;
    }
    if(t.id==='demoBtn'||t.id==='demoBtn2'){ loadDemo(); return; }
    if(t.id==='clrBtn'){
      if(!state.items.length) return;
      if(!confirm('确定清空全部抽卡对象？')) return;
      state.items = []; save(); paintManager(); renderBanner(); toast('已清空对象'); return;
    }
    if(t.id==='resetPity'){
      BANNERS.forEach(b=>{ state.pity[b.id]={c5:0,c4:0,guar5:false,guar4:false}; });
      save(); renderBanner(); toast('保底计数已重置'); return;
    }
    /* —— 数据导入 / 导出 —— */
    if(t.id==='dpExport'){ SFX.click(); DataPort.exportAll(); return; }
    if(t.id==='dpCopy'){ SFX.click(); DataPort.copyAll(); return; }
    if(t.id==='dpImport'){ SFX.click(); DataPort.pickImport(); return; }
    if(t.id==='dpPasteRead'){ SFX.click(); DataPort.readPaste(); return; }
    if(t.id==='dpWipe'){
      if(!confirm('确定重置全部数据？\n\n将清空对象、记录、统计、壁纸与按钮皮肤，且无法撤销。\n建议先导出一份备份。')) return;
      SFX.click(); DataPort.wipe(); return;
    }
    if(t.id==='rateReset'){
      state.rates = Object.assign({}, RATES_DEFAULT);
      save(); paintManager(); toast('已恢复默认概率'); return;
    }
    /* —— 背景壁纸面板 —— */
    if(t.dataset && t.dataset.wact){
      SFX.init(); SFX.resume(); SFX.click();
      const a = t.dataset.wact;
      if(a==='album'){ WALL.pick('album'); return; }
      if(a==='camera'){ WALL.renderCamBox(); return; }
      if(a==='default'){ WALL.reset(); toast('已恢复默认背景'); return; }
    }
    /* —— 按钮皮肤 —— */
    if(t.dataset && t.dataset.bsk){
      SFX.init(); SFX.resume(); SFX.click();
      const a = t.dataset.bsk;
      if(a==='album'){ BSKIN.pick('album'); return; }
      if(a==='camera'){ BSKIN.renderCamBox(); return; }
      if(a==='default'){ BSKIN.reset(); return; }
    }
    if(t.id==='skFit'){
      state.btn.skin.fit = state.btn.skin.fit === 'cover' ? 'contain' : 'cover';
      BSKIN.apply(); save(); BSKIN.mountPanel();
      /* 只改这一行按钮自己的文案，不整块重绘面板——重绘会把正在预览的相机框清掉 */
      t.textContent = '填充方式：' + (state.btn.skin.fit === 'cover' ? '铺满裁切' : '完整显示');
      return;
    }
    if(t.id==='skRatio'){
      state.btn.skin.ratio = !state.btn.skin.ratio;
      BSKIN.apply(); save(); BSKIN.mountPanel();
      t.textContent = '贴合图片比例：' + (state.btn.skin.ratio ? '开' : '关');
      return;
    }
    if(t.id==='wFit'){
      state.wall.fit = state.wall.fit === 'cover' ? 'contain' : 'cover';
      save(); WALL.paint(); WALL.mountPanel(); paintManager(); return;
    }
    if(t.id==='wVig'){ state.wall.vig = !state.wall.vig; save(); WALL.paint(); WALL.mountPanel(); paintManager(); return; }
    if(t.id==='wKb'){ state.wall.kb = !state.wall.kb; save(); WALL.paint(); WALL.mountPanel(); paintManager(); return; }
    if(t.id==='auTest'){
      SFX.init(); SFX.resume();
      SFX.sparkle(2400, 0.09, 1.6); SFX.sparkle(3220, 0.06, 1.9);
      toast('音效试听'); return;
    }
    /* —— 「祈愿」按钮尺寸预设 —— */
    if(t.dataset && t.dataset.bsz){
      SFX.init(); SFX.resume(); SFX.click();
      state.btn.scale = clampBtnScale(+t.dataset.bsz / 100);
      applyBtnScale(); save(); paintManager();
      toast('按钮尺寸 ' + Math.round(state.btn.scale * 100) + '%'); return;
    }
    if(t.dataset && t.dataset.avg){
      const rar = +t.dataset.avg;
      const arr = state.items.filter(i=>i.rarity===rar);
      if(!arr.length) return;
      arr.forEach(i=>i.weight = 1);
      save(); paintManager(); toast(`${rar} 星对象权重已均分`); return;
    }

    const row = t.closest('.irow');
    if(row){
      const it = itemById(row.dataset.id);
      if(!it) return;
      if(t.dataset.f==='up'){ it.up = !it.up; save(); paintManager(); renderBanner(); return; }
      if(t.dataset.f==='del'){ state.items = state.items.filter(x=>x.id!==it.id); save(); paintManager(); renderBanner(); return; }
    }
  });

  body.addEventListener('change', e=>{
    const el = e.target;
    if(el.id === 'wallFile' || el.id === 'wallCam'){
      const f = el.files && el.files[0];
      if(f) WALL.useFile(f);
      el.value = '';
      return;
    }
    if(el.id === 'skinFile' || el.id === 'skinCam'){
      const f = el.files && el.files[0];
      if(f) BSKIN.useFile(f);
      el.value = '';
      return;
    }
    if(el.id === 'dpFile'){
      const f = el.files && el.files[0];
      if(f) DataPort.readFile(f);
      el.value = '';
      return;
    }
    if(el.id === 'skText'){
      state.btn.skin.text = el.checked; BSKIN.apply(); save();
      toast(el.checked ? '已在皮肤上叠加按钮文字' : '不再叠加按钮文字'); return;
    }
    if(el.id === 'skChibi'){
      state.btn.skin.chibi = el.checked; BSKIN.apply(); save();
      toast(el.checked ? '已在皮肤上叠加小角色' : '不再叠加小角色'); return;
    }
    if(el.id === 'auOn'){
      state.audio.on = el.checked; SFX.init(); SFX.setVol(); save();
      toast(el.checked ? '已开启音效' : '已关闭音效');
      return;
    }
    const row = el.closest('.irow');
    if(!row) return;
    const it = itemById(row.dataset.id); if(!it) return;
    if(e.target.dataset.f==='rarity'){
      it.rarity = +e.target.value; save(); paintManager(); renderBanner();
    }
  });

  body.addEventListener('focusout', e=>{
    const f = e.target.dataset && e.target.dataset.f;
    if(f==='name' || f==='tag'){
      const row = e.target.closest('.irow'); if(!row) return;
      const it = itemById(row.dataset.id); if(!it) return;
      const v = (e.target.textContent||'').trim();
      if(f==='name'){
        if(!v){ e.target.textContent = it.name; toast('名称不能为空'); return; }
        it.name = v.slice(0,20);
      } else it.tag = v.slice(0,12);
      save(); renderBanner();
    }
  });

  body.addEventListener('input', e=>{
    const el = e.target;

    /* —— 壁纸调节滑块 —— */
    if(el.id === 'wDim' || el.id === 'wBlur'){
      if(el.id === 'wDim'){
        state.wall.dim = Math.max(0, Math.min(90, +el.value));
        const l = document.getElementById('wDimV'); if(l) l.textContent = state.wall.dim + '%';
      } else {
        state.wall.blur = Math.max(0, Math.min(30, +el.value));
        const l = document.getElementById('wBlurV'); if(l) l.textContent = state.wall.blur + 'px';
      }
      WALL.paint();
      const pv = document.querySelector('#wprev video, #wprev img');
      if(pv){
        pv.style.filter    = state.wall.blur ? 'blur(' + state.wall.blur + 'px)' : '';
        pv.style.transform = state.wall.blur ? 'scale(1.07)' : '';
      }
      const ov = document.querySelector('#wprev > div');
      if(ov) ov.style.background = 'rgba(4,8,18,' + (state.wall.dim/100) + ')';
      save(); return;
    }
    /* —— 音量滑块 —— */
    if(el.id === 'auVol'){
      state.audio.vol = Math.max(0, Math.min(100, +el.value));
      const l = document.getElementById('auVolV'); if(l) l.textContent = state.audio.vol + '%';
      SFX.init(); SFX.setVol(); save(); return;
    }
    /* —— 按钮皮肤滑块 —— */
    if(el.id === 'skDim'){
      state.btn.skin.dim = Math.max(0, Math.min(70, +el.value));
      const l = document.getElementById('skDimV'); if(l) l.textContent = state.btn.skin.dim + '%';
      BSKIN.apply(); BSKIN.mountPanel(); save(); return;
    }
    if(el.id === 'skRadius'){
      state.btn.skin.radius = Math.max(0, Math.min(30, +el.value));
      const l = document.getElementById('skRadiusV'); if(l) l.textContent = state.btn.skin.radius + 'px';
      BSKIN.apply(); BSKIN.mountPanel(); save(); return;
    }
    /* —— 「祈愿」按钮尺寸滑块 —— */
    if(el.id === 'btnSize'){
      state.btn.scale = clampBtnScale(+el.value / 100);
      const l = document.getElementById('btnSizeV'); if(l) l.textContent = Math.round(state.btn.scale * 100) + '%';
      applyBtnScale(); save(); return;
    }

    /* 卡池标题 */
    if(['p1n','p1s','p2n','p2s'].includes(el.id)){
      const map = {p1n:['char','name'], p1s:['char','sub'], p2n:['std','name'], p2s:['std','sub']};
      const [bk,fk] = map[el.id];
      state.meta[bk][fk] = el.value;
      save(); renderBanner(); return;
    }

    /* 全局概率 */
    if(el.dataset && el.dataset.rate){
      const k = el.dataset.rate;
      let v = parseFloat(el.value);
      if(!isFinite(v)) v = 0;
      v = Math.max(0, v);
      state.rates[k] = v;
      save(); updateSim(); return;
    }

    /* 对象权重 */
    if(el.dataset && (el.dataset.w || el.dataset.wn)){
      const id = el.dataset.w || el.dataset.wn;
      const it = itemById(id); if(!it) return;
      let v = parseFloat(el.value);
      if(!isFinite(v) || v < 0) v = 0;
      it.weight = v;
      syncWeight(id, el.dataset.w ? 'range' : 'number');
      save(); return;
    }
  });
}

function parseBulk(raw){
  const out = [];
  raw.split(/\r?\n/).forEach(line=>{
    let s = line.trim();
    if(!s) return;
    const parts = s.split(/[,，\t]+|\s{2,}|\s+(?=\d)/).map(x=>x.trim()).filter(Boolean);
    let name = parts[0]||'';
    let rar = 3, tag = '', up = false;
    for(let i=1;i<parts.length;i++){
      const seg = parts[i];
      if(/^[345]$/.test(seg)) rar = +seg;
      else if(/^(up|UP|Up)$/.test(seg)) up = true;
      else if(/^[★]{3,5}$/.test(seg)) rar = seg.length;
      else tag = tag ? tag + ' ' + seg : seg;
    }
    // 兼容 "名称 5" 这种两段式
    if(parts.length === 1 && /\s/.test(s)){
      const m = s.match(/^(.*?)\s+([345])\s*$/);
      if(m){ name = m[1].trim(); rar = +m[2]; }
    }
    name = name.slice(0,20); tag = tag.slice(0,12);
    if(!name) return;
    out.push({id:uid(), name, rarity:rar, tag, up, weight:1});
  });
  return out;
}

/* =========================================================
   12. 启动
   ========================================================= */
function boot(){
  load();
  FX.init(); RV.init(); bindManager();
  renderBanner();
  WALL.boot();
  BSKIN.boot();
  /* 套用用户设定的按钮倍率，并让页脚按按钮实际占位避让 */
  applyBtnScale();
  window.addEventListener('load', applyBtnScale);
  let _rzT = 0;
  window.addEventListener('resize', ()=>{ clearTimeout(_rzT); _rzT = setTimeout(applyBtnScale, 120); });

  const bind = (id, fn)=>{ const el = document.getElementById(id); if(el) el.onclick = fn; };
  bind('p1',      ()=>{ SFX.init(); SFX.resume(); SFX.click(); startPull(1); });
  bind('mgrTop',  ()=>{ SFX.init(); SFX.resume(); SFX.click(); openManager('list'); });
  bind('histTop', ()=>{ SFX.init(); SFX.resume(); SFX.click(); openHistory(); });
  bind('hintAdd', ()=>{ SFX.init(); SFX.resume(); SFX.click(); openManager('list'); });
  bind('bgBtn',   ()=>{ SFX.init(); SFX.resume(); openManager('wall'); });

  document.getElementById('skipBtn').onclick = e=>{ e.stopPropagation(); FX.skip(); };
  FX.layer.addEventListener('pointerdown', ()=>FX.skip());
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mask').onclick = e=>{ if(e.target.id==='mask') closeModal(); };
  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape') closeModal();
    if(e.key === ' ' && FX.busy){ e.preventDefault(); FX.skip(); }
  });
  /* 浏览器要求首次用户手势后才能出声 */
  const unlock = ()=>{ SFX.init(); SFX.resume(); document.removeEventListener('pointerdown', unlock); };
  document.addEventListener('pointerdown', unlock);
  document.addEventListener('visibilitychange', ()=>{ if(document.hidden && FX.busy) SFX.padOff(0.2); });

  save();
}
document.addEventListener('DOMContentLoaded', boot);

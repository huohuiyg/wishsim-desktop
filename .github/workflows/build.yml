name: Build Windows installer

# 触发方式：
#   1. 手动（Actions 页面点 Run workflow）
#   2. push 到 main 且改动涉及打包相关文件
#   3. 打 tag（v*）时自动构建并把安装包挂到 Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'dist/**'
      - 'index.html'
      - 'build.mjs'
      - 'package.json'
      - '.github/workflows/build.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Tauri build (windows-gnu, NSIS)
    runs-on: windows-latest
    timeout-minutes: 60

    # 注意：这里**不要**定义 TAURI_BUNDLER_TOOLS_GITHUB_MIRROR_TEMPLATE。
    # GitHub runner 直连 GitHub Releases 很顺，本就用不到镜像；
    # 而把它设成空字符串会被 Tauri 当成一个 URL 解析，报
    # `failed to bundle project: http: empty string`。
    # 本机需要用镜像时，只在本机的 build.mjs 里注入即可。

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm deps (@tauri-apps/cli)
        run: npm install

      - name: Setup Rust (GNU host toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          # 关键：host 也必须是 GNU，Tauri 的 winres 资源编译才会走 windres 分支
          toolchain: stable-x86_64-pc-windows-gnu

      - name: Install MinGW binutils (windres)
        shell: pwsh
        run: |
          $bin = "C:\ProgramData\mingw64\mingw64\bin"
          if (-not (Test-Path "$bin\windres.exe")) {
            choco install mingw --no-progress -y
          }
          echo $bin >> $env:GITHUB_PATH
          & "$bin\windres.exe" --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-gnu-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-gnu-cargo-

      - name: Sync frontend into dist/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (Test-Path index.html) { Copy-Item index.html dist/index.html -Force }
          Get-ChildItem dist | Select-Object Name, Length

      - name: Build Tauri app + NSIS installer
        run: npx tauri build
        working-directory: src-tauri

      - name: Rename installer to an ASCII filename
        shell: pwsh
        run: |
          # bundle 默认按 productName 命名（中文「祈愿_1.0.0_x64-setup.exe」）。
          # 中文名在 Release 资源 / 部分下载器上会被截断或转义，统一改成 ASCII：
          #   去掉开头的产品名部分，前缀换成 WishSimulator。
          $dir = "src-tauri/target/release/bundle/nsis"
          Get-ChildItem "$dir/*.exe" -Exclude "WishSimulator_*" | ForEach-Object {
            $suffix = ($_.Name -replace '^[^_]*_', '')   # 去掉「祈愿_」
            $dest = Join-Path $dir "WishSimulator_$suffix"
            Copy-Item $_.FullName $dest -Force
            Write-Host "renamed: $($_.Name) -> WishSimulator_$suffix"
          }
          Get-ChildItem "$dir/*.exe" | Select-Object Name, Length

      - name: Upload artifacts (exe + installer)
        uses: actions/upload-artifact@v4
        with:
          name: wish-simulator-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/wish-sim-desktop.exe
            src-tauri/target/release/bundle/nsis/WishSimulator_*.exe

      - name: Attach installer to Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/WishSimulator_*.exe
          draft: false

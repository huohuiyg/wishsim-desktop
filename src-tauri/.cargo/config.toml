# ============================================================
#  祈愿 · Wish Simulator  Windows 构建配置
# ------------------------------------------------------------
#  统一使用 Rust 官方的 x86_64-pc-windows-gnu 工具链构建，
#  不依赖 Visual Studio / MSVC。
#
#  ⚠️ 这里**故意不写 linker 路径**：
#     `linker` 是机器相关配置，写死绝对路径会让 CI（GitHub Actions）
#     或换一台机器直接报 `linker "D:/..." not found`。
#     - 本机（只装了 binutils、没有 gcc）：由 `build.mjs` 注入
#       RUSTFLAGS 指向工具链自带的 rust-lld（自包含链接）。
#     - CI：由 choco 安装的 MinGW 的 `gcc` 担任链接器（默认行为）。
#
#  这里只保留与机器无关的 rustflags。
# ============================================================
[target.x86_64-pc-windows-gnu]
rustflags = [
  "-Clink-self-contained=yes",       # 使用工具链自带的 MinGW 运行时库
  "-Ctarget-feature=+crt-static",    # 静态链接 C 运行时，产物免装运行库
]
